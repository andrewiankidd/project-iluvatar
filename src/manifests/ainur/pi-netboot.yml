apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pi-netboot
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ainur
  source:
    repoURL: https://github.com/andrewiankidd/project-iluvatar.git
    targetRevision:  main
    path: src/manifests/ainur/pi-netboot
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-netboot
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        ainur.kidd.network/ca: inject
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
