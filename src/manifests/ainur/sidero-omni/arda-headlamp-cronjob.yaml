# Puts arda in ainur's Headlamp, as a second cluster, rather than running a
# Headlamp on arda too. Every 30 minutes, makes sure the arda-kubeconfig
# Secret in ainur-headlamp holds a kubeconfig for talos-default from Omni
# (a service-account token through Omni's Kubernetes proxy, with the lab CA
# embedded, context "arda"), and makes a new one when it's missing, more than
# 30 days old, or for different groups. Headlamp mounts it
# (../headlamp/values.yaml), and is restarted to pick up a new one.
#
# The token's groups are what Headlamp's users get on arda: ARDA_GROUPS below.
#
# Does nothing until talos-default is up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arda-headlamp
  namespace: ainur-sidero-omni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arda-headlamp
  namespace: ainur-headlamp
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [headlamp]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arda-headlamp
  namespace: ainur-headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arda-headlamp
subjects:
  - kind: ServiceAccount
    name: arda-headlamp
    namespace: ainur-sidero-omni
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arda-headlamp
  namespace: ainur-sidero-omni
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: arda-headlamp
          restartPolicy: Never
          containers:
            - name: kubeconfig
              image: alpine/kubectl:1.37.1
              env:
                - name: OMNI_ENDPOINT
                  value: https://omni.kidd.network
                - name: CLUSTER
                  value: talos-default
                # What Headlamp's users get on arda (comma-separated): admin.
                # Only safe because all of Headlamp is behind a Dex login
                # (../headlamp/oauth2-proxy.yaml); Headlamp itself would hand
                # these rights to any request.
                - name: ARDA_GROUPS
                  value: system:masters
                - name: OMNICTL_URL
                  value: https://github.com/siderolabs/omni/releases/download/v1.13.3/omnictl-linux-arm64
              command:
                - sh
                - -c
                - |
                  set -eu
                  NS=ainur-headlamp
                  have="$(kubectl -n $NS get secret arda-kubeconfig -o jsonpath='{.metadata.annotations.kidd\.network/made} {.metadata.annotations.kidd\.network/groups}' 2>/dev/null || true)"
                  made="${have%% *}"; groups="${have#* }"
                  if [ -n "$made" ] && [ "$groups" = "$ARDA_GROUPS" ] && [ $(( $(date +%s) - made )) -lt 2592000 ]; then
                    echo "arda-kubeconfig is current"
                    exit 0
                  fi

                  apk add --no-cache ca-certificates curl >/dev/null
                  cat /etc/omni/lab-root-ca.crt >> /etc/ssl/certs/ca-certificates.crt
                  # omnictl and talosctl from the omni-tools volume, fetched once per
                  # version: not 72 MB into the SD card and from GitHub on every run.
                  fetch() { f="/tools/$(echo "$2" | sha256sum | cut -c1-12)-$1"; [ -s "$f" ] ||
                    { curl -fsSL -o "$f.$$" "$2" && chmod +x "$f.$$" && mv "$f.$$" "$f"; }; ln -sf "$f" "/usr/local/bin/$1"; }
                  fetch omnictl "$OMNICTL_URL"
                  chmod +x /usr/local/bin/omnictl
                  export OMNI_SERVICE_ACCOUNT_KEY="$(cat /omni-data/automation.key)"
                  if ! omnictl kubeconfig /tmp/arda --cluster "$CLUSTER" --service-account \
                      --user headlamp --groups "$ARDA_GROUPS" --force-context-name arda --force; then
                    echo "arda is not up yet"
                    exit 0
                  fi
                  # Headlamp reads only the file, so the lab CA goes in it.
                  c="$(kubectl --kubeconfig /tmp/arda config view -o jsonpath='{.clusters[0].name}')"
                  kubectl --kubeconfig /tmp/arda config set-cluster "$c" \
                    --certificate-authority=/etc/omni/lab-root-ca.crt --embed-certs >/dev/null
                  kubectl --kubeconfig /tmp/arda get --raw /version >/dev/null

                  # Replaced, not applied: kubectl apply would keep a second
                  # copy of the kubeconfig in its last-applied annotation.
                  kubectl -n $NS delete secret arda-kubeconfig --ignore-not-found
                  kubectl -n $NS create secret generic arda-kubeconfig --from-file=config=/tmp/arda
                  kubectl -n $NS annotate secret arda-kubeconfig \
                    kidd.network/made="$(date +%s)" kidd.network/groups="$ARDA_GROUPS"
                  kubectl -n $NS rollout restart deploy/headlamp
                  echo "arda-kubeconfig made for groups $ARDA_GROUPS; Headlamp restarted"
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: omni-data
                  mountPath: /omni-data
                  readOnly: true
                - name: lab-root-ca
                  mountPath: /etc/omni/lab-root-ca.crt
                  subPath: ca.crt
                  readOnly: true
          # For the automation key on Omni's ReadWriteOnce data volume, as in
          # omni-cluster-template-sync-job.yaml.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: omni
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: tools
              persistentVolumeClaim:
                claimName: omni-tools
            - name: omni-data
              persistentVolumeClaim:
                claimName: omni
                readOnly: true
            - name: lab-root-ca
              configMap:
                name: lab-ca
