# Keeps the router's port forwards in step with arda: every arda Service
# annotated kidd.network/port-forward: "true" gets a UniFi port forward per
# port, from the internet to its LoadBalancer address (192.168.1.58, see
# src/manifests/arda/metallb). Take the annotation off, or the Service away,
# and its forwards go. Nothing to list: the ports are the Services' own.
#
# Only touches forwards it made, named "k8s <namespace>/<service> <port>/<proto>";
# any made by hand are left alone. DRY_RUN=1 only says what it would change.
#
# Reads ARDA_UNIFI_API_KEY (a UniFi OS API key: Settings > Control Plane >
# Integrations) and optionally ARDA_UNIFI_URL from arda-secrets, the ARDA_*
# values in the bootstrap VM's .env. Does nothing without the key, or until
# talos-default is up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unifi-port-forwards
  namespace: ainur-sidero-omni
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: alpine/kubectl:1.37.1
              env:
                - name: OMNI_ENDPOINT
                  value: https://omni.kidd.network
                - name: CLUSTER
                  value: talos-default
                - name: UNIFI_SITE
                  value: default
                - name: DRY_RUN
                  value: "0"
                - name: OMNICTL_URL
                  value: https://github.com/siderolabs/omni/releases/download/v1.13.3/omnictl-linux-arm64
              envFrom:
                - secretRef:
                    name: arda-secrets
                    optional: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  [ -n "${ARDA_UNIFI_API_KEY:-}" ] || { echo "no ARDA_UNIFI_API_KEY; nothing to do"; exit 0; }
                  apk add --no-cache ca-certificates curl jq >/dev/null
                  cat /etc/omni/lab-root-ca.crt >> /etc/ssl/certs/ca-certificates.crt
                  curl -fsSL -o /usr/local/bin/omnictl "$OMNICTL_URL"
                  chmod +x /usr/local/bin/omnictl
                  [ -s /omni-data/automation.key ] || { echo "Omni isn't up yet"; exit 0; }
                  export OMNI_SERVICE_ACCOUNT_KEY="$(cat /omni-data/automation.key)"
                  export KUBECONFIG=/tmp/kubeconfig
                  if ! omnictl kubeconfig "$KUBECONFIG" --cluster "$CLUSTER" \
                      --service-account --user unifi-port-forwards --force >/dev/null 2>&1 \
                    || ! kubectl get --raw /readyz >/dev/null 2>&1; then
                    echo "$CLUSTER isn't up yet"; exit 0
                  fi

                  # What arda wants forwarded. A Service still waiting for its
                  # address wants nothing yet.
                  kubectl get svc -A -o json | jq '[.items[]
                    | select(.metadata.annotations["kidd.network/port-forward"] == "true")
                    | (.status.loadBalancer.ingress // [])[0].ip as $ip | select($ip)
                    | .metadata as $m | .spec.ports[]
                    | (.protocol | ascii_downcase) as $proto
                    | {name: "k8s \($m.namespace)/\($m.name) \(.port)/\($proto)",
                       fwd: $ip, dst_port: (.port | tostring), fwd_port: (.port | tostring), proto: $proto}]' > /tmp/want.json

                  # The UniFi Network app's port forwards. Its certificate is
                  # the console's own self-signed one.
                  base="${ARDA_UNIFI_URL:-https://192.168.1.1}/proxy/network/api/s/$UNIFI_SITE/rest/portforward"
                  api() { curl -fsSk -H "X-API-KEY: $ARDA_UNIFI_API_KEY" -H 'Content-Type: application/json' "$@"; }
                  api "$base" | jq '[.data[] | select(.name | startswith("k8s "))]' > /tmp/have.json

                  change() {
                    echo "$1"
                    [ "$DRY_RUN" = 1 ] || api -o /dev/null -X "$2" "$3" ${4:+--data "$4"}
                  }
                  # Add or correct what's wanted.
                  jq -c '.[]' /tmp/want.json | while read -r w; do
                    name=$(printf '%s' "$w" | jq -r .name)
                    rule=$(printf '%s' "$w" | jq -c '. + {enabled: true, pfwd_interface: "wan", src: "any", destination_ip: "any", log: false}')
                    have=$(jq -c --arg n "$name" '.[] | select(.name == $n)' /tmp/have.json | head -n1)
                    if [ -z "$have" ]; then
                      change "add $name -> $(printf '%s' "$w" | jq -r .fwd)" POST "$base" "$rule"
                    elif [ "$(printf '%s' "$have" | jq -c '{fwd, dst_port, fwd_port, proto, enabled}')" != \
                           "$(printf '%s' "$rule" | jq -c '{fwd, dst_port, fwd_port, proto, enabled}')" ]; then
                      change "update $name" PUT "$base/$(printf '%s' "$have" | jq -r ._id)" "$rule"
                    fi
                  done
                  # Remove ours that nothing wants any more.
                  jq -c --slurpfile want /tmp/want.json '.[] | select(.name as $n | $want[0] | map(.name) | index($n) | not)' /tmp/have.json \
                    | while read -r h; do
                      change "remove $(printf '%s' "$h" | jq -r .name)" DELETE "$base/$(printf '%s' "$h" | jq -r ._id)"
                    done
                  echo "$(jq length /tmp/want.json) forwards wanted"
              volumeMounts:
                - name: omni-data
                  mountPath: /omni-data
                  readOnly: true
                - name: lab-root-ca
                  mountPath: /etc/omni/lab-root-ca.crt
                  subPath: ca.crt
                  readOnly: true
          # For the automation key on Omni's ReadWriteOnce data volume, as in
          # omni-cluster-template-sync-job.yaml.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: omni
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: omni-data
              persistentVolumeClaim:
                claimName: omni
                readOnly: true
            - name: lab-root-ca
              configMap:
                name: lab-ca
