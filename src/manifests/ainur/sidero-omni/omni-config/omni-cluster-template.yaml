kind: Cluster
name: talos-default
kubernetes:
  version: v1.37.1
talos:
  # Keep in step with TALOS_VERSION in ../talos-schematic-job.yaml.
  version: v1.14.6
patches:
  # Already in the image the machines boot (../talos-schematic-job.yaml);
  # repeated here so it stays in every cluster member's config regardless.
  - name: lab-root-ca
    inline:
      apiVersion: v1alpha1
      kind: TrustedRootsConfig
      name: lab-root-ca
      certificates: |
        ${LAB_ROOT_CA_INDENTED}
  - name: install-nvme-128gb
    inline:
      machine:
        install:
          diskSelector:
            size: 128GB
---
kind: ControlPlane
machineClass:
  name: available
  size: 1
---
kind: Workers
machineClass:
  name: available
  size: 3
