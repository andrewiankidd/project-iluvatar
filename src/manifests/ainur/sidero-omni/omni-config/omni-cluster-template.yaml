kind: Cluster
name: talos-default
kubernetes:
  version: v1.37.1
talos:
  # Keep in step with TALOS_VERSION in ../talos-schematic-job.yaml.
  version: v1.14.6
patches:
  # Already in the image the machines boot (../talos-schematic-job.yaml);
  # repeated here so it stays in every cluster member's config regardless.
  - name: lab-root-ca
    inline:
      apiVersion: v1alpha1
      kind: TrustedRootsConfig
      name: lab-root-ca
      certificates: |
        ${LAB_ROOT_CA_INDENTED}
  # The NVMe drive, whatever its size; the SATA SSD is Longhorn's.
  - name: install-nvme
    inline:
      machine:
        install:
          diskSelector:
            type: nvme
  # Workloads on the control plane too, so one machine is already a cluster
  # and every node's SSD counts for Longhorn.
  - name: schedule-on-control-plane
    inline:
      cluster:
        allowSchedulingOnControlPlanes: true
  # Longhorn (src/manifests/arda/longhorn.yml) on each node's SATA SSD,
  # mounted at /var/mnt/longhorn and shared with the kubelet.
  - name: longhorn-disk
    inline:
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: longhorn
      volumeType: disk
      provisioning:
        diskSelector:
          match: disk.transport == "sata" && !system_disk
      filesystem:
        type: xfs
  - name: longhorn-kubelet
    inline:
      machine:
        kubelet:
          extraMounts:
            - destination: /var/mnt/longhorn
              type: bind
              source: /var/mnt/longhorn
              options: [bind, rshared, rw]
---
kind: ControlPlane
machineClass:
  name: available
  size: 1
---
# Whatever else is switched on, so the cluster grows as machines join.
kind: Workers
machineClass:
  name: available
  size: unlimited
