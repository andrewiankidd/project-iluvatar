kind: Cluster
name: talos-default
kubernetes:
  version: v1.37.1
talos:
  # Keep in step with TALOS_VERSION in ../talos-schematic-job.yaml.
  version: v1.14.5
patches:
  # Already in the image the machines boot (../talos-schematic-job.yaml);
  # repeated here so it stays in every cluster member's config regardless.
  - name: lab-root-ca
    inline:
      apiVersion: v1alpha1
      kind: TrustedRootsConfig
      name: lab-root-ca
      certificates: |
        ${LAB_ROOT_CA_INDENTED}
  # The NVMe drive, whatever its size; the SATA SSD is Longhorn's.
  - name: install-nvme
    inline:
      machine:
        install:
          diskSelector:
            type: nvme
  # Workloads on the control plane too, so one machine is already a cluster
  # and every node's SSD counts for Longhorn.
  # Talos 1.14 dropped cluster.allowSchedulingOnControlPlanes: the
  # control plane's NoSchedule taint lives in KubeNodeConfig now.
  - name: schedule-on-control-plane
    inline:
      apiVersion: v1alpha1
      kind: KubeNodeConfig
      taints:
        node-role.kubernetes.io/control-plane:
          $patch: delete
  # Longhorn (src/manifests/arda/longhorn.yml) on each node's SATA SSD,
  # mounted at /var/mnt/longhorn. Talos 1.14 has no kubelet extraMounts (the
  # v1alpha1 machine.kubelet section is gone); user volumes under /var/mnt
  # are expected to reach the kubelet without one.
  - name: longhorn-disk
    inline:
      apiVersion: v1alpha1
      kind: UserVolumeConfig
      name: longhorn
      volumeType: disk
      provisioning:
        diskSelector:
          match: disk.transport == "sata" && !system_disk
      filesystem:
        type: xfs
---
kind: ControlPlane
machineClass:
  name: available
  size: 1
---
# Whatever else is switched on, so the cluster grows as machines join.
kind: Workers
machineClass:
  name: available
  size: unlimited
