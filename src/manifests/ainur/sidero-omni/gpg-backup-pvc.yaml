apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-gpg-backup
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    ainur.kidd.network/workload: sidero-omni
    ainur.kidd.network/volume: gpg-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-replicated-ext4-immediate
  resources:
    requests:
      storage: 16Mi
  # The etcd encryption key's saved copy, restored before the key job runs
  # (omni-volsync.yaml), so Omni gets the key its restored data needs.
  dataSourceRef:
    apiGroup: volsync.backube
    kind: ReplicationDestination
    name: omni-gpg-backup-restore
