# Pushes arda app Secrets to arda (the talos-default cluster) so that
# src/manifests/arda Argo CD Applications (managed by ainur's Argo CD) can
# reference them.
#
# Waits until the cluster is up, however long that takes. Re-running it is
# harmless — each Secret is applied idempotently.
apiVersion: batch/v1
kind: Job
metadata:
  name: arda-bootstrap
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: alpine/kubectl:1.37.1
          env:
            - name: OMNI_ENDPOINT
              value: https://omni.kidd.network
            - name: CLUSTER
              value: talos-default
            - name: OMNICTL_URL
              value: https://github.com/siderolabs/omni/releases/download/v1.13.3/omnictl-linux-arm64
            # Dex's client secret, for arda's oauth2-proxy (Dex's "arda" client).
            - name: AINUR_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ainur-secrets
                  key: AINUR_OIDC_CLIENT_SECRET
                  optional: true
          envFrom:
            - secretRef:
                name: arda-secrets
                optional: true
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache ca-certificates curl
              cat /etc/omni/lab-root-ca.crt >> /etc/ssl/certs/ca-certificates.crt
              # omnictl and talosctl from the omni-tools volume, fetched once per
              # version: not 72 MB into the SD card and from GitHub on every run.
              fetch() { f="/tools/$(echo "$2" | sha256sum | cut -c1-12)-$1"; [ -s "$f" ] ||
                { curl -fsSL -o "$f.$$" "$2" && chmod +x "$f.$$" && mv "$f.$$" "$f"; }; ln -sf "$f" "/usr/local/bin/$1"; }
              fetch omnictl "$OMNICTL_URL"
              chmod +x /usr/local/bin/omnictl
              # On a fresh ainur, Omni can start well after this Job: wait for it to
              # write its key and answer, rather than spend the retries and fail.
              until [ -s /omni-data/automation.key ]; do echo "waiting for Omni's key"; sleep 10; done
              export OMNI_SERVICE_ACCOUNT_KEY="$(cat /omni-data/automation.key)"
              until omnictl get clusters >/dev/null 2>&1; do echo "waiting for Omni"; sleep 10; done

              # Until a machine has joined and arda's API answers; a Job that
              # waits reads as Progressing, where failing retries read as broken.
              export KUBECONFIG=/tmp/kubeconfig
              until omnictl kubeconfig /tmp/kubeconfig --cluster "$CLUSTER" \
                  --service-account --user arda-bootstrap --force >/dev/null 2>&1 \
                && kubectl get --raw /readyz >/dev/null 2>&1; do
                echo "waiting for $CLUSTER"; sleep 60
              done

              # Each app's Secret, from whichever ARDA_* values are set —
              # ainur's Argo CD syncs src/manifests/arda and references these.
              put() {
                ns=$1; name=$2; shift 2
                kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
                kubectl -n "$ns" create secret generic "$name" "$@" \
                  --dry-run=client -o yaml | kubectl apply -f -
              }
              # The lab CA, for arda's metrics and logs collectors to trust
              # ainur's Prometheus and Loki (src/manifests/arda/monitoring).
              # The chart reads its other optional fields from the same
              # Secret, so they're here, empty.
              put monitoring ainur-telemetry --from-file=ca.crt=/etc/omni/lab-root-ca.crt                 --from-literal=cert= --from-literal=key= --from-literal=tenantId=
              if [ -n "${ARDA_CLOUDFLARE_API_TOKEN:-}" ]; then
                put external-dns cloudflare-api-token --from-literal=api-token="$ARDA_CLOUDFLARE_API_TOKEN"
                put ddns cloudflare-api-token --from-literal=api-token="$ARDA_CLOUDFLARE_API_TOKEN"
              fi
              if [ -n "${ARDA_CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
                put cloudflared cloudflared-tunnel --from-literal=token="$ARDA_CLOUDFLARE_TUNNEL_TOKEN"
              fi
              # external-dns-lan's LAN records in UniFi (src/manifests/arda/external-dns-lan.yml).
              if [ -n "${ARDA_UNIFI_API_KEY:-}" ]; then
                put external-dns unifi-api-key --from-literal=UNIFI_API_KEY="$ARDA_UNIFI_API_KEY"
              fi
              if [ -n "${ARDA_MINECRAFT_WHITELIST:-}${ARDA_MINECRAFT_BUILDERS:-}" ]; then
                put minecraft minecraft-players \
                  --from-literal=whitelist="${ARDA_MINECRAFT_WHITELIST:-}" \
                  --from-literal=builders="${ARDA_MINECRAFT_BUILDERS:-}"
              fi
              if [ -n "${ARDA_DRAGONWILDS_OWNER_ID:-}" ]; then
                set -- --from-literal=owner-id="$ARDA_DRAGONWILDS_OWNER_ID" \
                  --from-literal=admin-password="${ARDA_DRAGONWILDS_ADMIN_PASSWORD:-}"
                if [ -n "${ARDA_DRAGONWILDS_WORLD_PASSWORD:-}" ]; then
                  set -- "$@" --from-literal=world-password="$ARDA_DRAGONWILDS_WORLD_PASSWORD"
                fi
                put dragonwilds dragonwilds "$@"
              fi
              # The GitLab runner (src/manifests/arda/gitlab-runner.yml): a glrt-
              # runner authentication token; the chart wants both keys.
              if [ -n "${ARDA_GITLAB_RUNNER_TOKEN:-}" ]; then
                put gitlab-runner gitlab-runner \
                  --from-literal=runner-token="$ARDA_GITLAB_RUNNER_TOKEN" \
                  --from-literal=runner-registration-token=
              fi
              # The Dex login in front of arda's sites (src/manifests/arda/oauth2-proxy.yml):
              # Dex's client secret, and the lab CA that dex.kidd.network's
              # certificate is from.
              if [ -n "${AINUR_OIDC_CLIENT_SECRET:-}" ]; then
                put oauth2-proxy dex \
                  --from-literal=client-secret="$AINUR_OIDC_CLIENT_SECRET" \
                  --from-file=ca.crt=/etc/omni/lab-root-ca.crt
              fi
              # Paperless (src/manifests/arda/paperless.yml): its Django key,
              # admin and scanner passwords and the optional mailbox; and the
              # same Dex client secret and lab CA as oauth2-proxy's, for its
              # own "Sign in with Dex".
              if [ -n "${ARDA_PAPERLESS_SECRET_KEY:-}" ]; then
                set -- --from-literal=secret-key="$ARDA_PAPERLESS_SECRET_KEY" \
                  --from-literal=admin-password="${ARDA_PAPERLESS_ADMIN_PASSWORD:-}" \
                  --from-literal=scanner-password="${ARDA_PAPERLESS_SCANNER_PASSWORD:-}"
                for v in HOST PORT USER PASSWORD FOLDER; do
                  eval "x=\${ARDA_PAPERLESS_MAIL_$v:-}"
                  [ -z "$x" ] || set -- "$@" --from-literal="mail-$(echo "$v" | tr A-Z a-z)=$x"
                done
                put paperless paperless "$@"
              fi
              if [ -n "${AINUR_OIDC_CLIENT_SECRET:-}" ]; then
                put paperless dex \
                  --from-literal=client-secret="$AINUR_OIDC_CLIENT_SECRET" \
                  --from-file=ca.crt=/etc/omni/lab-root-ca.crt
              fi
              # Obsidian's CouchDB login (src/manifests/arda/obsidian.yml).
              if [ -n "${ARDA_OBSIDIAN_PASSWORD:-}" ]; then
                put obsidian obsidian --from-literal=password="$ARDA_OBSIDIAN_PASSWORD"
              fi
              # The media apps' API keys (src/manifests/arda/media.yml): one per
              # app, derived from one secret, so the apps and the wiring Job
              # agree on them without a value per app in .env.
              if [ -n "${ARDA_MEDIA_API_SECRET:-}" ]; then
                set --
                for app in sonarr radarr prowlarr bazarr seerr; do
                  set -- "$@" --from-literal="$app-api-key=$(printf '%s' "$ARDA_MEDIA_API_SECRET:$app" | sha256sum | cut -c1-32)"
                done
                put media media "$@"
              fi
              # qBittorrent's VPN (src/manifests/arda/media/qbittorrent.yaml):
              # a Mullvad WireGuard key and its address. Without them
              # qBittorrent never starts.
              if [ -n "${ARDA_MULLVAD_PRIVATE_KEY:-}" ] && [ -n "${ARDA_MULLVAD_ADDRESSES:-}" ]; then
                set -- --from-literal=private-key="$ARDA_MULLVAD_PRIVATE_KEY" \
                  --from-literal=addresses="$ARDA_MULLVAD_ADDRESSES"
                if [ -n "${ARDA_MULLVAD_COUNTRY:-}" ]; then
                  set -- "$@" --from-literal=country="$ARDA_MULLVAD_COUNTRY"
                fi
                put media mullvad "$@"
              fi
              # arda's LAN HTTPS certificate, from the lab CA (arda-lan-certificate.yaml),
              # for arda's Traefik. Copied on every run, so renewals follow.
              if [ -s /arda-lan-tls/tls.crt ]; then
                kubectl -n kube-system create secret tls arda-lan-tls \
                  --cert=/arda-lan-tls/tls.crt --key=/arda-lan-tls/tls.key \
                  --dry-run=client -o yaml | kubectl apply -f -
              fi
              # Every volume's backups (src/manifests/arda/kyverno-policies/volsync.yaml):
              # one restic repository per volume under volsync/ in the
              # arda-backups bucket, all with the same password.
              if [ -n "${ARDA_BACKUP_ACCESS_KEY_ID:-}" ] && [ -n "${ARDA_VOLSYNC_PASSWORD:-}" ]; then
                put volsync-system volsync-r2 \
                  --from-literal=AWS_ACCESS_KEY_ID="$ARDA_BACKUP_ACCESS_KEY_ID" \
                  --from-literal=AWS_SECRET_ACCESS_KEY="${ARDA_BACKUP_SECRET_ACCESS_KEY:-}" \
                  --from-literal=RESTIC_PASSWORD="$ARDA_VOLSYNC_PASSWORD" \
                  --from-literal=RESTIC_REPOSITORY_BASE="s3:${ARDA_BACKUP_ENDPOINT:-}/arda-backups/volsync"
              fi

              echo "[arda-bootstrap] secrets pushed; arda workloads are managed by ainur's Argo CD"
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: omni-data
              mountPath: /omni-data
              readOnly: true
            - name: lab-root-ca
              mountPath: /etc/omni/lab-root-ca.crt
              subPath: ca.crt
              readOnly: true
            - name: arda-lan-tls
              mountPath: /arda-lan-tls
              readOnly: true
      # For the automation key on Omni's ReadWriteOnce data volume, as in
      # omni-cluster-template-sync-job.yaml.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: omni
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: tools
          persistentVolumeClaim:
            claimName: omni-tools
        - name: omni-data
          persistentVolumeClaim:
            claimName: omni
            readOnly: true
        - name: lab-root-ca
          configMap:
            name: lab-ca
        - name: arda-lan-tls
          secret:
            secretName: arda-lan-tls
            optional: true
