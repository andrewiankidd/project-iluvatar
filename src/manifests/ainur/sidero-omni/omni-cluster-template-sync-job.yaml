apiVersion: batch/v1
kind: Job
metadata:
  name: omni-cluster-template-sync
  namespace: ainur-sidero-omni
  # A changed Job spec cannot be patched; recreate it instead.
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync-template
          image: alpine:3.20
          env:
            - name: OMNI_ENDPOINT
              value: https://omni.kidd.network
            - name: REPO_URL
              value: https://github.com/andrewiankidd/project-iluvatar
            - name: REPO_REF
              value: main
            - name: CONFIG_PATH
              value: src/manifests/ainur/sidero-omni/omni-config
            - name: OMNICTL_URL
              value: https://github.com/siderolabs/omni/releases/download/v1.13.3/omnictl-linux-arm64
          command:
            - sh
            - -c
            - |
              set -eu
              apk add --no-cache ca-certificates curl git gettext
              # trust lab CA for omnictl grpc/http calls
              cat /etc/omni/lab-root-ca.crt >> /etc/ssl/certs/ca-certificates.crt
              # omnictl and talosctl from the omni-tools volume, fetched once per
              # version: not 72 MB into the SD card and from GitHub on every run.
              fetch() { f="/tools/$(echo "$2" | sha256sum | cut -c1-12)-$1"; [ -s "$f" ] ||
                { curl -fsSL -o "$f.$$" "$2" && chmod +x "$f.$$" && mv "$f.$$" "$f"; }; ln -sf "$f" "/usr/local/bin/$1"; }
              fetch omnictl "$OMNICTL_URL"
              chmod +x /usr/local/bin/omnictl
              # On a fresh ainur, Omni can start well after this Job: wait for it to
              # write its key and answer, rather than spend the retries and fail.
              until [ -s /omni-data/automation.key ]; do echo "waiting for Omni's key"; sleep 10; done
              export OMNI_SERVICE_ACCOUNT_KEY="$(cat /omni-data/automation.key)"
              until omnictl get clusters >/dev/null 2>&1; do echo "waiting for Omni"; sleep 10; done

              workdir="$(mktemp -d)"
              cd "$workdir"
              git init -q
              git remote add origin "$REPO_URL"
              git config core.sparseCheckout true
              echo "$CONFIG_PATH/" > .git/info/sparse-checkout
              git fetch -q --depth 1 origin "$REPO_REF"
              git checkout -q FETCH_HEAD

              export LAB_ROOT_CA_INDENTED
              LAB_ROOT_CA_INDENTED="$(sed '2,$s/^/        /' /etc/omni/lab-root-ca.crt)"
              # Only this variable: the template has $patch keys envsubst would blank.
              envsubst '${LAB_ROOT_CA_INDENTED}' < "$CONFIG_PATH/omni-cluster-template.yaml" > /tmp/omni-cluster-template.rendered.yaml

              omnictl apply -f "$CONFIG_PATH/machine-class.yaml"
              omnictl cluster template sync \
                -f /tmp/omni-cluster-template.rendered.yaml
          volumeMounts:
            - name: tools
              mountPath: /tools
            - name: omni-data
              mountPath: /omni-data
              readOnly: true
            - name: lab-root-ca
              mountPath: /etc/omni/lab-root-ca.crt
              subPath: ca.crt
              readOnly: true
      # Omni's data volume holds the automation service account key
      # (values.yaml initialServiceAccount); it is ReadWriteOnce, so run on
      # Omni's node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: omni
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: tools
          persistentVolumeClaim:
            claimName: omni-tools
        - name: omni-data
          persistentVolumeClaim:
            claimName: omni
            readOnly: true
        - name: lab-root-ca
          configMap:
            name: lab-ca
