# Omni's two volumes, backed up to R2 nightly and restored when created, by
# VolSync (../volsync.yml): omni (its state: every machine's registration, the
# cluster, the join tokens) and omni-gpg-backup (the key that state is
# encrypted with). Lose them and every machine has to be registered again.
#
# Each gets its own restic repository, arda-backups/volsync/ainur/<pvc>, with
# the ARDA_BACKUP_* keys and ARDA_VOLSYNC_PASSWORD from arda-secrets; the
# CronJob below makes each one's repository Secret from those.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-volsync-secrets
  namespace: ainur-sidero-omni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-volsync-secrets
  namespace: ainur-sidero-omni
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-volsync-secrets
  namespace: ainur-sidero-omni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-volsync-secrets
subjects:
  - kind: ServiceAccount
    name: omni-volsync-secrets
    namespace: ainur-sidero-omni
---
# Every 5 minutes, so a fresh cluster's restore waits at most that long for
# its Secret, and a changed password or key reaches it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: omni-volsync-secrets
  namespace: ainur-sidero-omni
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: omni-volsync-secrets
          restartPolicy: Never
          containers:
            - name: secrets
              image: alpine/kubectl:1.37.1
              envFrom:
                - secretRef:
                    name: arda-secrets
                    optional: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  if [ -z "${ARDA_BACKUP_ACCESS_KEY_ID:-}" ] || [ -z "${ARDA_VOLSYNC_PASSWORD:-}" ]; then
                    echo "no ARDA_BACKUP_* or ARDA_VOLSYNC_PASSWORD yet"; exit 0
                  fi
                  for pvc in omni omni-gpg-backup; do
                    kubectl -n ainur-sidero-omni create secret generic "$pvc-volsync" \
                      --from-literal=AWS_ACCESS_KEY_ID="$ARDA_BACKUP_ACCESS_KEY_ID" \
                      --from-literal=AWS_SECRET_ACCESS_KEY="${ARDA_BACKUP_SECRET_ACCESS_KEY:-}" \
                      --from-literal=RESTIC_PASSWORD="$ARDA_VOLSYNC_PASSWORD" \
                      --from-literal=RESTIC_REPOSITORY="s3:${ARDA_BACKUP_ENDPOINT:-}/arda-backups/volsync/ainur/$pvc" \
                      --dry-run=client -o yaml | kubectl apply -f -
                  done
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: omni-restore
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  trigger:
    manual: restore-once
  restic:
    repository: omni-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapshot
    storageClassName: longhorn-replicated-xfs-immediate
    accessModes: [ReadWriteOnce]
    capacity: 20Gi
    cacheStorageClassName: longhorn-replicated-ext4-immediate
    cacheCapacity: 1Gi
    cleanupCachePVC: true
    # Kept: Longhorn's snapshots live inside the volume they were taken
    # from, so the PVC cloning from this one would never finish if it went.
    cleanupTempPVC: false
    enableFileDeletion: true
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: omni-gpg-backup-restore
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  trigger:
    manual: restore-once
  restic:
    repository: omni-gpg-backup-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapshot
    storageClassName: longhorn-replicated-ext4-immediate
    accessModes: [ReadWriteOnce]
    capacity: 16Mi
    cacheStorageClassName: longhorn-replicated-ext4-immediate
    cacheCapacity: 1Gi
    cleanupCachePVC: true
    # Kept: Longhorn's snapshots live inside the volume they were taken
    # from, so the PVC cloning from this one would never finish if it went.
    cleanupTempPVC: false
    enableFileDeletion: true
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: omni-backup
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: omni
  trigger:
    schedule: "30 3 * * *"
  restic:
    repository: omni-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapshot
    storageClassName: longhorn-replicated-xfs-immediate
    cacheStorageClassName: longhorn-replicated-ext4-immediate
    cacheCapacity: 1Gi
    pruneIntervalDays: 7
    # The last 5 whatever their day, too: a backup run straight after a
    # failed restore must not prune the good one from earlier that day.
    retain:
      last: "5"   # a string, unlike the others (VolSync's CRD)
      daily: 7
      weekly: 4
      monthly: 6
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: omni-gpg-backup-backup
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sourcePVC: omni-gpg-backup
  trigger:
    schedule: "30 3 * * *"
  restic:
    repository: omni-gpg-backup-volsync
    copyMethod: Snapshot
    volumeSnapshotClassName: longhorn-snapshot
    storageClassName: longhorn-replicated-ext4-immediate
    cacheStorageClassName: longhorn-replicated-ext4-immediate
    cacheCapacity: 1Gi
    pruneIntervalDays: 7
    # The last 5 whatever their day, too: a backup run straight after a
    # failed restore must not prune the good one from earlier that day.
    retain:
      last: "5"   # a string, unlike the others (VolSync's CRD)
      daily: 7
      weekly: 4
      monthly: 6
