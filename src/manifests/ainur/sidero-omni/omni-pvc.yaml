# Omni's data (/data: its etcd, machine configs and the automation key),
# defined here rather than by the chart (values.yaml: persistence.existingClaim).
# local-path on valar-50's NVMe, where Omni runs.
# Wave 0, with Omni and the Jobs that mount it: local-path makes a volume
# only once a pod using it is scheduled, and Argo CD waits for a wave's
# claims to be bound before starting the next.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
