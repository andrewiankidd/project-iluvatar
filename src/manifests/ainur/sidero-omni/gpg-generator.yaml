apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-gpg-init
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-gpg-init
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-gpg-init
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: omni-gpg-init
    namespace: ainur-sidero-omni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-gpg-init
---
apiVersion: batch/v1
kind: Job
metadata:
  name: omni-gpg-init
  namespace: ainur-sidero-omni
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: omni-gpg-init
    spec:
      serviceAccountName: omni-gpg-init
      restartPolicy: Never
      # nodeSelector:
      #   kidd.network/role: "worker"
      volumes:
        - name: work
          emptyDir: {}
        - name: backup
          persistentVolumeClaim:
            claimName: omni-gpg-backup
      containers:
        - name: gen
          image: alpine:3.20
          command: ["/bin/sh","-ec"]
          args:
            - |
              apk add --no-cache gnupg
              cat >/work/gen-batch <<'EOF'
              %no-protection
              Key-Type: RSA
              Key-Length: 3072
              # Primary key certifies and signs; encryption is delegated to subkey
              Key-Usage: cert,sign
              Subkey-Type: RSA
              Subkey-Length: 3072
              Subkey-Usage: encrypt
              Name-Real: Omni
              Name-Email: omni-etcd@local
              Expire-Date: 0
              %commit
              EOF
              gpg --batch --gen-key /work/gen-batch
              gpg --batch --pinentry-mode loopback --passphrase "" --export-secret-keys --armor omni-etcd@local > /work/omni.asc
              # Backup into Longhorn PVC (don't overwrite if already present)
              [ -s /backup/omni.asc ] || cp /work/omni.asc /backup/omni.asc
          volumeMounts:
            - name: work
              mountPath: /work
            - name: backup
              mountPath: /backup
        - name: apply
          image: alpine/kubectl:1.34.1
          command: ["/bin/sh","-ec"]
          args:
            - |
              set -euo pipefail
              # If Secret already exists, exit successfully
              if kubectl -n ainur-sidero-omni get secret omni-gpg >/dev/null 2>&1; then
                echo "omni-gpg already exists; skipping"
                exit 0
              fi
              # The saved key wins: a restored omni-gpg-backup (omni-volsync.yaml)
              # holds the key Omni's restored data is encrypted with, and a new
              # one couldn't read it. Only with no saved key is the new one used,
              # and saved.
              if [ ! -s /backup/omni.asc ]; then
                for i in $(seq 1 60); do [ -s /work/omni.asc ] && break; sleep 1; done
                test -s /work/omni.asc
                cp /work/omni.asc /backup/omni.asc
              fi
              b64=$(base64 -w0 /backup/omni.asc 2>/dev/null || base64 /backup/omni.asc)
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: omni-gpg
                namespace: ainur-sidero-omni
              type: Opaque
              data:
                omni.asc: ${b64}
              EOF
          volumeMounts:
            - name: work
              mountPath: /work
            - name: backup
              mountPath: /backup
