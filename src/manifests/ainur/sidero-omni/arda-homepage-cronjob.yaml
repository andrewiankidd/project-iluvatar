# Lists arda's apps on ainur's Homepage. Every 5 minutes, copies each arda
# Ingress that has gethomepage.dev/enabled into ainur-homepage, keeping only
# its gethomepage.dev/* annotations, hosts and TLS. The copies use an Ingress
# class nothing serves, so Traefik and cert-manager ignore them, and Homepage
# discovers them like ainur's own. Copies of Ingresses gone from arda go too.
#
# Does nothing until talos-default is up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arda-homepage
  namespace: ainur-sidero-omni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arda-homepage
  namespace: ainur-homepage
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arda-homepage
  namespace: ainur-homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arda-homepage
subjects:
  - kind: ServiceAccount
    name: arda-homepage
    namespace: ainur-sidero-omni
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arda-homepage
  namespace: ainur-sidero-omni
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: arda-homepage
          restartPolicy: Never
          containers:
            - name: copy
              image: alpine/kubectl:1.37.1
              env:
                - name: OMNI_ENDPOINT
                  value: https://omni.kidd.network
                - name: CLUSTER
                  value: talos-default
                - name: OMNICTL_URL
                  value: https://github.com/siderolabs/omni/releases/download/v1.13.3/omnictl-linux-arm64
              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache ca-certificates curl jq >/dev/null
                  cat /etc/omni/lab-root-ca.crt >> /etc/ssl/certs/ca-certificates.crt
                  # omnictl and talosctl from the omni-tools volume, fetched once per
                  # version: not 72 MB into the SD card and from GitHub on every run.
                  fetch() { f="/tools/$(echo "$2" | sha256sum | cut -c1-12)-$1"; [ -s "$f" ] ||
                    { curl -fsSL -o "$f.$$" "$2" && chmod +x "$f.$$" && mv "$f.$$" "$f"; }; ln -sf "$f" "/usr/local/bin/$1"; }
                  fetch omnictl "$OMNICTL_URL"
                  chmod +x /usr/local/bin/omnictl
                  export OMNI_SERVICE_ACCOUNT_KEY="$(cat /omni-data/automation.key)"

                  if ! omnictl kubeconfig /tmp/arda --cluster "$CLUSTER" \
                      --service-account --user arda-homepage --ttl 10m --force ||
                    ! kubectl --kubeconfig /tmp/arda get ingress -A -o json > /tmp/arda.json; then
                    echo "arda is not up yet"
                    exit 0
                  fi

                  jq '{apiVersion: "v1", kind: "List", items: [.items[]
                    | select(.metadata.annotations["gethomepage.dev/enabled"] == "true")
                    | {apiVersion: "networking.k8s.io/v1", kind: "Ingress",
                       metadata: {
                         name: ("arda-" + .metadata.namespace + "-" + .metadata.name),
                         namespace: "ainur-homepage",
                         labels: {"homepage.kidd.network/copy-of": "arda"},
                         annotations: (.metadata.annotations
                           | with_entries(select(.key | startswith("gethomepage.dev/"))))},
                       spec: {ingressClassName: "arda-homepage", tls: .spec.tls,
                         rules: .spec.rules}}]}' /tmp/arda.json > /tmp/copies.json
                  echo "arda Ingresses to list: $(jq '.items | length' /tmp/copies.json)"

                  if [ "$(jq '.items | length' /tmp/copies.json)" -gt 0 ]; then
                    kubectl -n ainur-homepage apply -f /tmp/copies.json --prune \
                      -l homepage.kidd.network/copy-of=arda \
                      --prune-allowlist=networking.k8s.io/v1/Ingress
                  else
                    kubectl -n ainur-homepage delete ingress \
                      -l homepage.kidd.network/copy-of=arda --ignore-not-found
                  fi
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: omni-data
                  mountPath: /omni-data
                  readOnly: true
                - name: lab-root-ca
                  mountPath: /etc/omni/lab-root-ca.crt
                  subPath: ca.crt
                  readOnly: true
          # For the automation key on Omni's ReadWriteOnce data volume, as in
          # omni-cluster-template-sync-job.yaml.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: omni
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: tools
              persistentVolumeClaim:
                claimName: omni-tools
            - name: omni-data
              persistentVolumeClaim:
                claimName: omni
                readOnly: true
            - name: lab-root-ca
              configMap:
                name: lab-ca
