apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: ainur-headlamp
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "local-ca"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance.private: ""
    gethomepage.dev/group: Cluster
    gethomepage.dev/name: Headlamp
    gethomepage.dev/description: Kubernetes dashboard
    gethomepage.dev/icon: mdi-kubernetes
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headlamp.kidd.network
      secretName: headlamp-tls
  rules:
    - host: headlamp.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
