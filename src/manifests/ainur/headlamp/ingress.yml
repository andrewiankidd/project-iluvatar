apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: ainur-headlamp
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "local-ca"
    kidd.network/tunnel: "true"
    kidd.network/zero-trust: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: admin
    gethomepage.dev/group: Cluster
    gethomepage.dev/name: Headlamp
    gethomepage.dev/description: Kubernetes dashboard
    gethomepage.dev/icon: mdi-kubernetes
    # Its pods, for the status badge (the default looks for the Ingress's name).
    gethomepage.dev/pod-selector: app.kubernetes.io/name=headlamp
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headlamp.kidd.network
      secretName: headlamp-tls
  rules:
    - host: headlamp.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            # Through the Dex login (oauth2-proxy.yaml), not straight to Headlamp.
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
