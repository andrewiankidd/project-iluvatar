serviceAccount:
  create: true
  name: headlamp

rbac:
  create: true

config:
  inCluster: true
  # Client ID, secret, issuer and scopes come from the headlamp-oidc Secret
  # (user-data: ainur-secrets.sh); the rest are HEADLAMP_CONFIG_* below, which
  # the chart's external-secret mode does not pass on itself.
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
  # arda, as a second cluster: a kubeconfig from Omni, kept in the
  # arda-kubeconfig Secret by ainur's arda-headlamp CronJob
  # (../sidero-omni/arda-headlamp-cronjob.yaml).
  extraArgs:
    - -kubeconfig=/home/headlamp/arda/config

env:
  - name: HEADLAMP_CONFIG_OIDC_CALLBACK_URL
    value: "https://headlamp.kidd.network/oidc-callback"
  - name: HEADLAMP_CONFIG_OIDC_USE_ACCESS_TOKEN
    value: "true"
  - name: SSL_CERT_DIR
    value: /etc/ssl/local-ca
volumes:
  - name: local-ca
    configMap:
      name: lab-ca
      optional: true
  # Optional: Headlamp starts without arda until the CronJob has made it.
  - name: arda-kubeconfig
    secret:
      secretName: arda-kubeconfig
      optional: true
volumeMounts:
  - name: local-ca
    mountPath: /etc/ssl/local-ca
    readOnly: true
  - name: arda-kubeconfig
    mountPath: /home/headlamp/arda
    readOnly: true
clusterRoleBinding:
  create: false
