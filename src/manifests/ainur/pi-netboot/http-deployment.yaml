apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bootstrap-http
spec:
  selector:
    matchLabels:
      app: netboot
      component: http
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: netboot
        component: http
    spec:
      # ainur keeps its state on valar-50 (local-path on its NVMe).
      nodeSelector:
        kidd.network/role: "control-plane"
      # The VIP and netbooting the other Pis: evicted last.
      priorityClassName: ainur-critical
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: verify-volume-mounts
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              test -d /boot || exit 1
              test -f /mnt/k3s/k3s-leader
              test -f /mnt/k3s/k3s-agent-token
          volumeMounts:
            - name: boot
              mountPath: /boot
            - name: k3s-leader
              mountPath: /mnt/k3s/k3s-leader
            - name: k3s-agent-token
              mountPath: /mnt/k3s/k3s-agent-token
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  test -f /usr/share/nginx/html/k3s/k3s-leader && \
                  test -f /usr/share/nginx/html/k3s/k3s-agent-token
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 1
          volumeMounts:
            - name: boot
              mountPath: /usr/share/nginx/html
            - name: k3s-leader
              mountPath: /usr/share/nginx/html/k3s/k3s-leader
              readOnly: true
            - name: k3s-agent-token
              mountPath: /usr/share/nginx/html/k3s/k3s-agent-token
              readOnly: true
            # /talos/boot.ipxe, written by sidero-omni's talos-schematic Job.
            - name: talos-ipxe
              mountPath: /usr/share/nginx/html/talos
              readOnly: true
            # /talos-media/metal-amd64.iso, cached by talos-iso.yaml.
            - name: talos-media
              mountPath: /usr/share/nginx/html/talos-media
              readOnly: true
      volumes:
        - name: boot
          persistentVolumeClaim:
            claimName: pi-netboot-boot
        - name: k3s-leader
          hostPath:
            path: /tmp/k3s/k3s-leader
            type: File
        - name: k3s-agent-token
          hostPath:
            path: /tmp/k3s/k3s-agent-token
            type: File
        - name: talos-ipxe
          configMap:
            name: talos-ipxe
            optional: true
        - name: talos-media
          persistentVolumeClaim:
            claimName: talos-media
