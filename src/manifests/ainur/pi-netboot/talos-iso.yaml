# Caches what sidero-omni's talos-schematic Job built (lab CA and Omni join
# config inside), so the x86 machines get it from ainur over the LAN rather
# than from the image factory over the internet. bootstrap-http serves it at
# /talos-media/:
#   <schematic>/<version>/kernel-amd64, initramfs-amd64.xz   for netboot
#                                                            (boot.ipxe)
#   metal-amd64.iso                     for machines that boot from USB
#
# Every 5 minutes it compares the schematic's with what it has, and
# downloads only when they differ, so the media follows Omni's join config
# without waiting for an Argo CD sync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: talos-media
  labels:
    ainur.kidd.network/workload: pi-netboot
    ainur.kidd.network/volume: talos-media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-iso
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          # valar-50, where talos-media lives (local-path on its NVMe).
          nodeSelector:
            kidd.network/role: "control-plane"
          containers:
            - name: download
              image: alpine:3.20
              command:
                - sh
                - -c
                - |
                  set -eu
                  cd /media
                  # The kernel and initramfs the x86 machines netboot
                  # (boot.ipxe loads them from here), in a directory per
                  # schematic and version; older ones are removed.
                  img="$(cat /talos/pxe-image-url 2>/dev/null || true)"
                  dir="$(cat /talos/cache-dir 2>/dev/null || true)"
                  if [ -n "$img" ] && [ -n "$dir" ]; then
                    if [ -s "$dir/initramfs-amd64.xz" ] && [ -s "$dir/kernel-amd64" ]; then
                      echo "already have $dir"
                    else
                      rm -rf "$dir.tmp"; mkdir -p "$dir.tmp"
                      wget -q -O "$dir.tmp/kernel-amd64" "$img/kernel-amd64"
                      wget -q -O "$dir.tmp/initramfs-amd64.xz" "$img/initramfs-amd64.xz"
                      rm -rf "$dir"; mv "$dir.tmp" "$dir"
                      echo "cached $img"
                    fi
                    keep="${dir%%/*}"
                    for d in */; do
                      d="${d%/}"
                      [ "$d" = "$keep" ] || [ "$d" = lost+found ] || { rm -rf "./$d"; echo "removed $d"; }
                    done
                    for d in "$keep"/*/; do
                      [ "$d" = "$dir/" ] || { rm -rf "./$d"; echo "removed $d"; }
                    done
                  fi

                  # The ISO, for machines that boot from USB.
                  url="$(cat /talos/iso-url)"
                  if [ "$(cat metal-amd64.iso.url 2>/dev/null)" = "$url" ]; then
                    echo "already have $url"
                    exit 0
                  fi
                  wget -q -O metal-amd64.iso.tmp "$url"
                  mv metal-amd64.iso.tmp metal-amd64.iso
                  echo "$url" > metal-amd64.iso.url
                  echo "cached $url"
              volumeMounts:
                - name: talos-ipxe
                  mountPath: /talos
                  readOnly: true
                - name: media
                  mountPath: /media
          volumes:
            - name: talos-ipxe
              configMap:
                name: talos-ipxe
            - name: media
              persistentVolumeClaim:
                claimName: talos-media
