# Hands a netbooted Pi its k3s agent token over SSH every time it boots
# (bootstrap/netboot/scripts/push-secrets.sh, agent mode): a netbooted Pi
# keeps nothing across a reboot, and the token is never served over HTTP or
# put in an image. The bootstrap VM runs the same script with all of .env
# for a cold start; this one has only the push key and the agent token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-pusher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secrets-pusher
  template:
    metadata:
      labels:
        app: secrets-pusher
    spec:
      nodeSelector:
        kidd.network/role: control-plane
      # Without it the netbooted Pis can't rejoin after a reboot.
      priorityClassName: ainur-critical
      initContainers:
        - name: script
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -eu
              apk add -q --no-cache git
              git clone --depth=1 --filter=blob:none --sparse --branch main \
                https://github.com/andrewiankidd/project-iluvatar.git /repo
              git -C /repo sparse-checkout set bootstrap/netboot/scripts
              cp /repo/bootstrap/netboot/scripts/push-secrets.sh /script/
          volumeMounts:
            - name: script
              mountPath: /script
      containers:
        - name: pusher
          image: alpine:3.20
          command: ["sh", "-c", "apk add -q --no-cache openssh-client-default && exec sh /script/push-secrets.sh"]
          env:
            - name: PUSH_MODE
              value: agent
            - name: PUSH_ENV_DIR
              value: /secrets
            # This /24 is the node's.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: script
          emptyDir: {}
        # ainur-secrets.sh puts it here from the VM's push; until then the
        # pusher waits.
        - name: secrets
          secret:
            secretName: ainur-secrets
            optional: true
            items:
              - key: AINUR_PUSH_KEY
                path: AINUR_PUSH_KEY
              - key: AINUR_K3S_AGENT_TOKEN
                path: AINUR_K3S_AGENT_TOKEN
