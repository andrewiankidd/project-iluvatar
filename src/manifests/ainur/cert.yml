apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-download
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ainur
  source:
    repoURL: https://github.com/andrewiankidd/project-iluvatar
    targetRevision:  main
    path: src/manifests/ainur/cert
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-cert
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        ainur.kidd.network/ca: inject
    syncOptions:
      - CreateNamespace=true
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true

