            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(sonarr_episode_missing_total)",
              "legendFormat": "episodes missing"
            },
            {
              "refId": "B",
              "expr": "sum(radarr_movie_missing_total)",
              "legendFormat": "movies missing"
            },
            {
              "refId": "C",
              "expr": "sum(bazarr_subtitles_missing_total)",
              "legendFormat": "subtitles missing"
            }
          ],
          "id": 12,
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          }
        }
      ]
    }
