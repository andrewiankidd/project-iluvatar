# The rack screen: everything at a glance, for a screen in the rack showing
# its shared link full-screen (a small device with a browser in kiosk mode).
# A 1080p landscape screen: the status tiles, then per machine, then network,
# the outside checks and the largest volumes, then what's wrong by name.
# Tagged shared, so ../grafana-share.yaml shares it with no login; the private
# Homepage links to it (Lab: Rack screen). Keep its uid. LAN only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rack-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Lab
data:
  rack.json: |
    {
      "uid": "rack",
      "title": "Rack",
      "description": "Everything at a glance, for a screen in the rack.",
      "tags": [
        "shared"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "timepicker": {
        "hidden": true
      },
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 100,
          "type": "stat",
        "transparent": true,
          "title": "Alerts firing",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff757f",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)"
            }
          ]
        },
        {
          "id": 101,
          "type": "stat",
        "transparent": true,
          "title": "Nodes not ready",
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff757f",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 0) or vector(0)"
            }
          ]
        },
        {
          "id": 102,
          "type": "stat",
        "transparent": true,
          "title": "Checks failing",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff757f",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(probe_success{probe=~\"tunnel|port-forward\"} == 0) or vector(0)"
            }
          ]
        },
        {
          "id": 103,
          "type": "stat",
        "transparent": true,
          "title": "Backups missed",
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff757f",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(volsync_volume_out_of_sync{role=\"source\"} == 1) or vector(0)"
            }
          ]
        },
        {
          "id": 104,
          "type": "stat",
        "transparent": true,
          "title": "Omni backed up",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff966c",
                    "value": 129600
                  },
                  {
                    "color": "#ff757f",
                    "value": 172800
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max(kube_cronjob_status_last_successful_time{cronjob=\"omni-backup\"})"
            }
          ]
        },
        {
          "id": 105,
          "type": "stat",
        "transparent": true,
          "title": "Longhorn used",
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#82aaff",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(longhorn_node_storage_usage_bytes)"
            }
          ]
        },
        {
          "id": 106,
          "type": "stat",
        "transparent": true,
          "title": "Longhorn full",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff966c",
                    "value": 70
                  },
                  {
                    "color": "#ff757f",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(longhorn_node_storage_usage_bytes) / sum(longhorn_node_storage_capacity_bytes)"
            }
          ]
        },
        {
          "id": 107,
          "type": "stat",
        "transparent": true,
          "title": "Pod restarts, 1h",
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#c3e88d",
                    "value": null
                  },
                  {
                    "color": "#ff966c",
                    "value": 5
                  },
                  {
                    "color": "#ff757f",
                    "value": 20
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "round(sum(increase(kube_pod_container_status_restarts_total[1h])))"
            }
          ]
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU per machine",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "expr": "100 * (1 - avg by (nodename) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]) * on (cluster, instance) group_left (nodename) node_uname_info))"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory per machine",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "expr": "100 * (1 - max by (nodename) (node_memory_MemAvailable_bytes * on (cluster, instance) group_left (nodename) node_uname_info) / max by (nodename) (node_memory_MemTotal_bytes * on (cluster, instance) group_left (nodename) node_uname_info))"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Temperature per machine",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{nodename}}",
              "expr": "max by (nodename) (node_thermal_zone_temp * on (cluster, instance) group_left (nodename) node_uname_info)"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Network (out below 0)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{cluster}} in",
              "expr": "sum by (cluster) (rate(node_network_receive_bytes_total{device=~\"en.*|eth.*\"}[5m]))"
            },
            {
              "refId": "B",
              "legendFormat": "{{cluster}} out",
              "expr": "-sum by (cluster) (rate(node_network_transmit_bytes_total{device=~\"en.*|eth.*\"}[5m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "state-timeline",
          "title": "Outside checks",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#ff757f",
                    "value": null
                  },
                  {
                    "color": "#c3e88d",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "down"
                    },
                    "1": {
                      "text": "up"
                    }
                  }
                }
              ],
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.8,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{instance}}",
              "expr": "min by (instance) (probe_success{probe=~\"tunnel|port-forward\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Largest volumes",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 11,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "min": 0,
              "color": {
                "mode": "continuous-BlYlRd"
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "legendFormat": "{{pvc_namespace}}/{{pvc}}",
              "expr": "topk(8, max by (pvc_namespace, pvc) (longhorn_volume_actual_size_bytes{pvc!~\"volsync-.*\"}))"
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Alerts firing",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 7
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "None"
            },
            "overrides": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "indexByName": {
                  "severity": 0,
                  "alertname": 1,
                  "cluster": 2,
                  "namespace": 3
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "max by (alertname, severity, cluster, namespace) (ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"})"
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Pods not running",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 7
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "noValue": "None"
            },
            "overrides": []
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true
                },
                "indexByName": {
                  "cluster": 0,
                  "namespace": 1,
                  "pod": 2,
                  "phase": 3
                }
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "format": "table",
              "expr": "max by (cluster, namespace, pod, phase) (kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} == 1)"
            }
          ]
        }
      ]
    }
