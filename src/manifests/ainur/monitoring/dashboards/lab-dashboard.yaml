# Lab status, the dashboard the private Homepage embeds (Lab folder, tagged
# shared, so grafana-share.yaml shares it with no login): a table with a row
# per machine (both clusters, from node_uname_info: a new machine gets its
# row with no list), each of CPU, memory, network and hottest temperature a
# small graph with its value beside it; above it, one row the same width for
# the alerts firing, with the last day's graph. Anything else worth showing (a missed backup, a failing
# outside check, restarts, a node down, a disk filling) is an alert, so it
# shows in that count.
#
# Dark, only the graphs in colour: the lab's primary #82aaff (Tokyo Night
# moon's blue, the palette of Homepage's #222436 background), amber #ffc777
# when a value is risky, red #ff757f when it's wrong.
#
# A click opens, in a new tab: on a machine, the chart's Node Exporter /
# Nodes dashboard set to it; on the alerts, Grafana's list of what's firing.
# Both behind the Dex login.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Lab
data:
  lab.json: |
    {
      "uid": "lab",
      "title": "Lab status",
      "tags": [
        "shared"
      ],
      "timezone": "browser",
      "description": "Every machine, and the alerts firing. The private Homepage embeds it.",
      "refresh": "1m",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "hidden": true
      },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 2,
          "type": "table",
          "title": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "transparent": true,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 2
          },
          "timeFrom": "24h",
          "hideTimeOverride": true,
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace(count(ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0), \"name\", \"Alerts firing\", \"\", \"\")"
            }
          ],
          "transformations": [
            {
              "id": "timeSeriesTable",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "name": 0,
                  "Trend #A": 1
                },
                "renameByName": {
                  "name": "Alerts",
                  "Trend #A": "Last 24 hours"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "links": [
                {
                  "title": "Every alert",
                  "url": "https://grafana.kidd.network/alerting/list?search=state:firing",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Alerts"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 200
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last 24 hours"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#82aaff",
                          "value": null
                        },
                        {
                          "color": "#ff757f",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "sparkline",
                      "hideValue": false,
                      "lineWidth": 1,
                      "fillOpacity": 15,
                      "drawStyle": "line"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 760
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": false,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 1,
          "type": "table",
          "title": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "transparent": true,
          "gridPos": {
            "x": 0,
            "y": 2,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))) * on (cluster, instance) group_left (nodename) max by (cluster, instance, nodename) (node_uname_info)"
            },
            {
              "refId": "B",
              "expr": "100 * (1 - max by (cluster, instance) (node_memory_MemAvailable_bytes) / max by (cluster, instance) (node_memory_MemTotal_bytes)) * on (cluster, instance) group_left (nodename) max by (cluster, instance, nodename) (node_uname_info)"
            },
            {
              "refId": "C",
              "expr": "(sum by (cluster, instance) (rate(node_network_receive_bytes_total{device=~\"en.*|eth.*\"}[5m])) + sum by (cluster, instance) (rate(node_network_transmit_bytes_total{device=~\"en.*|eth.*\"}[5m]))) * on (cluster, instance) group_left (nodename) max by (cluster, instance, nodename) (node_uname_info)"
            },
            {
              "refId": "D",
              "expr": "max by (cluster, instance) (node_thermal_zone_temp) * on (cluster, instance) group_left (nodename) max by (cluster, instance, nodename) (node_uname_info)"
            }
          ],
          "transformations": [
            {
              "id": "timeSeriesTable",
              "options": {}
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "nodename": 0,
                  "cluster": 1,
                  "Trend #A": 2,
                  "Trend #B": 3,
                  "Trend #C": 4,
                  "Trend #D": 5,
                  "instance": 6
                },
                "renameByName": {
                  "nodename": "Machine",
                  "cluster": "Cluster",
                  "Trend #A": "CPU",
                  "Trend #B": "Memory",
                  "Trend #C": "Network",
                  "Trend #D": "Temp"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "links": [
                {
                  "title": "${__data.fields.Machine} in detail",
                  "url": "https://grafana.kidd.network/d/7d57716318ee0dddbac5a7f451fb7753/node-exporter-nodes?var-cluster=${__data.fields.Cluster}&var-instance=${__data.fields.instance}",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#82aaff",
                          "value": null
                        },
                        {
                          "color": "#ffc777",
                          "value": 70
                        },
                        {
                          "color": "#ff757f",
                          "value": 90
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "sparkline",
                      "hideValue": false,
                      "lineWidth": 1,
                      "fillOpacity": 15,
                      "drawStyle": "line"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#82aaff",
                          "value": null
                        },
                        {
                          "color": "#ffc777",
                          "value": 80
                        },
                        {
                          "color": "#ff757f",
                          "value": 90
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "sparkline",
                      "hideValue": false,
                      "lineWidth": 1,
                      "fillOpacity": 15,
                      "drawStyle": "line"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Network"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "Bps"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#82aaff",
                          "value": null
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "sparkline",
                      "hideValue": false,
                      "lineWidth": 1,
                      "fillOpacity": 15,
                      "drawStyle": "line"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#82aaff",
                          "value": null
                        },
                        {
                          "color": "#ffc777",
                          "value": 70
                        },
                        {
                          "color": "#ff757f",
                          "value": 80
                        }
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds"
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "sparkline",
                      "hideValue": false,
                      "lineWidth": 1,
                      "fillOpacity": 15,
                      "drawStyle": "line"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Machine"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 120
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Cluster"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Machine",
                "desc": false
              }
            ]
          }
        }
      ]
    }
