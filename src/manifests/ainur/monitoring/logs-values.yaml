# k8s-monitoring 4.6.1 on ainur (../ainur-logs.yml): ainur's pod logs and
# Kubernetes events into Loki, labelled cluster="ainur". Metrics are
# kube-prometheus-stack's (values.yaml), not this.
cluster:
  name: ainur

destinations:
  loki:
    type: loki
    url: http://loki.ainur-monitoring.svc:3100/loki/api/v1/push

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

clusterEvents:
  enabled: true
  collector: alloy-singleton

collectors:
  alloy-logs:
    presets: [filesystem-log-reader, daemonset]
  alloy-singleton:
    presets: [singleton]
