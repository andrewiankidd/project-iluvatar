# Loki 3.6 (chart 7.7.0) on ainur (../loki.yml): the lab's logs, from both
# clusters' Alloy (logs-values.yaml here, src/manifests/arda/monitoring there).
# One process, its data on valar-50's NVMe, two weeks kept.
fullnameOverride: loki
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 336h
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor

singleBinary:
  replicas: 1
  nodeSelector:
    kidd.network/role: control-plane
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path-kept
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 1Gi

# The scalable targets, and the extras a single binary doesn't need.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
