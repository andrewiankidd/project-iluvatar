# Prometheus, Alertmanager and Grafana for both clusters (monitoring/values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: ainur
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.4.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/src/manifests/ainur/monitoring/values.yaml
    # The Ingresses arda writes to, and the lab's alert rules.
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision: main
      path: src/manifests/ainur/monitoring
      directory:
        # dashboards/ too: every Grafana dashboard, one ConfigMap each.
        recurse: true
        exclude: '*values.yaml'
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs are too big for client-side apply.
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        ainur.kidd.network/ca: inject
        # node-exporter and the log collectors read the host.
        pod-security.kubernetes.io/enforce: privileged
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
