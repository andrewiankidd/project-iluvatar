  styles.css: |
    .theme-body {
      background-color: #222436;
      color: #c0caf5;
      font-family: 'Source Sans Pro', Helvetica, sans-serif;
    }
    .theme-navbar {
      background-color: transparent;
      box-shadow: none;
      height: 128px;
      overflow: hidden;
      padding: 0;
      text-align: center;
    }
    .theme-navbar__logo-wrap {
      display: inline-block;
      height: 100%;
      padding: 18px 0 0;
      width: auto;
    }
    .theme-navbar__logo {
      height: 96px;
      max-height: 96px;
    }
    .theme-heading {
      font-size: 20px;
      font-weight: 500;
      margin-top: 0;
      color: #c0caf5;
    }
    .theme-panel {
      background-color: #1e2030;
      border: 1px solid #2f334d;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      padding: 30px;
    }
    .theme-btn-provider {
      background-color: #2f334d;
      color: #c0caf5;
      border: 1px solid #3b4261;
      border-radius: 6px;
      min-width: 250px;
    }
    .theme-btn-provider:hover {
      background-color: #3b4261;
      color: #ffffff;
    }
    .theme-btn--primary {
      background-color: #7aa2f7;
      border: none;
      border-radius: 6px;
      color: #1b1d2b;
      font-weight: 600;
      min-width: 200px;
      padding: 8px 12px;
    }
    .theme-btn--primary:hover {
      background-color: #89b4fa;
      color: #1b1d2b;
    }
    .theme-btn--success {
      background-color: #9ece6a;
      border-radius: 6px;
      color: #1b1d2b;
      width: 250px;
    }
    .theme-btn--success:hover {
      background-color: #b4e07f;
    }
    .theme-form-row {
      display: block;
      margin: 20px auto;
    }
    .theme-form-input {
      display: block;
      height: 38px;
      padding: 6px 12px;
      font-size: 14px;
      line-height: 1.42857143;
      border: 1px solid #3b4261;
      border-radius: 6px;
      color: #c0caf5;
      background-color: #222436;
      box-shadow: none;
      width: 250px;
      margin: auto;
    }
    .theme-form-input:focus,
    .theme-form-input:active {
      outline: none;
      border-color: #7aa2f7;
      color: #c0caf5;
    }
    .theme-form-label {
      width: 250px;
      margin: 4px auto;
      text-align: left;
      position: relative;
      font-size: 13px;
      font-weight: 600;
      color: #a9b1d6;
    }
    .theme-link-back {
      margin-top: 4px;
    }
    .dex-container {
      color: #c0caf5;
    }
    .dex-subtle-text {
      color: #828bb8;
    }
    .dex-error-box {
      background-color: #3b2433;
      border-radius: 6px;
      color: #ff757f;
    }
