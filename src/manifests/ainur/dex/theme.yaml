# Dex's look: the "kiddnet" theme (values.yaml, frontend), to match the
# Homepages. Tokyo Night Storm's colours (#222436 is its background), the AK
# logo over a globe (the KiddNet logo) in the bar, and the plain AK as the
# favicon. Only the theme's own files: Dex's page templates stay its own, so
# upgrading Dex doesn't fight this. Mounted at /srv/dex/web/themes/kiddnet;
# Reloader restarts Dex when it changes.
#
# The favicon is the logo rendered at 64px:
#   rsvg-convert -w 64 -h 64 logo.svg -o favicon.png
apiVersion: v1
kind: ConfigMap
