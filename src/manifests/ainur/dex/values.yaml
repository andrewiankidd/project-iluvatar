config:
  issuer: https://dex.kidd.network
  storage:
    type: memory
  enablePasswordDB: true
  staticPasswords:
    - email: admin@kidd.network
      # The bcrypt hash, from AINUR_DEX_ADMIN_HASH in the bootstrap .env.
      # Make one with: htpasswd -nbBC 10 "" 'password' | tr -d ':\n'
      hashFromEnv: AINUR_DEX_ADMIN_HASH
      username: admin
      userID: "0001"
  staticClients:
    - id: headlamp
      name: headlamp
      secretEnv: AINUR_OIDC_CLIENT_SECRET
      redirectURIs:
        - https://headlamp.kidd.network/oidc-callback
    - id: argocd
      name: argocd
      secretEnv: AINUR_OIDC_CLIENT_SECRET
      redirectURIs:
        - https://argocd.kidd.network/auth/callback
    - id: homepage
      name: homepage
      secretEnv: AINUR_OIDC_CLIENT_SECRET
      redirectURIs:
        - https://userpage.kidd.network/api/auth/callback/homepage-oidc
    - id: omni
      name: omni
      secretEnv: AINUR_OIDC_CLIENT_SECRET
      redirectURIs:
        - https://omni.kidd.network/oidc/consume
        - https://omni.kidd.network/auth/callback
        - https://omni.kidd.network/oidc/callback
        - https://omni.kidd.network/callback

service:
  type: ClusterIP

# AINUR_* from the ainur-secrets Secret (user-data: ainur-secrets.sh).
envFrom:
  - secretRef:
      name: ainur-secrets
