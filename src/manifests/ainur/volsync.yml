# Backups of ainur's irreplaceable volumes to Cloudflare R2, and restores from
# them: VolSync, with restic. Only Omni's two (sidero-omni/omni-volsync.yaml):
# everything else here rebuilds itself from Git and .env.
#
# A PVC whose dataSourceRef names a ReplicationDestination waits until VolSync
# is installed and has restored it, so a fresh cluster needs no sync order:
# Omni simply starts once its data is back.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volsync
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: ainur
  source:
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    targetRevision: 0.17.0
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-volsync
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
