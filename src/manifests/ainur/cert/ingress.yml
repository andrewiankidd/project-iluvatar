apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cert-download
  namespace: ainur-cert
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "local-ca"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance.public: ""
    gethomepage.dev/instance.private: ""
    gethomepage.dev/group: Lab
    gethomepage.dev/name: Lab CA
    gethomepage.dev/description: Trust this lab's certificates
    gethomepage.dev/icon: mdi-certificate
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cert.kidd.network
      secretName: cert-site-tls
  rules:
    - host: cert.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cert-download
                port:
                  number: 80
