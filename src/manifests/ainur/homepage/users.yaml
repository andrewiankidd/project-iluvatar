# userpage.kidd.network: the users' page (values-users.yaml), behind the
# lab's shared sign-in (oauth2-proxy, LLDAP's users and admins), on the LAN
# and, through the tunnel, the internet. Like the admin page, the page has
# no login of its own: one sign-in covers it and every other proxied site.
# Its sign-out is the Account bookmark. Dex's homepage client, with this
# callback (../dex/values.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-users
  namespace: ainur-homepage
  annotations:
    secret.reloader.stakater.com/reload: ainur-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-users
  template:
    metadata:
      labels:
        app: oauth2-proxy-users
    spec:
      priorityClassName: ainur-optional
      # The cookie key, derived from AINUR_SSO_SECRET, the same on every
      # rebuild, so sign-ins outlive a restart.
      initContainers:
        - name: cookie-secret
          image: alpine:3.22
          command:
            - sh
            - -c
            - printf '%s' "$SSO_SECRET:kidd-users-cookie" | sha256sum | cut -c1-32 | tr -d '\n' > /secret/cookie
          env:
            # AINUR_SSO_SECRET (.env): dedicated random cookie seed, separate
            # from the OIDC client secret.
            - name: SSO_SECRET
              valueFrom:
                secretKeyRef:
                  name: ainur-secrets
                  key: AINUR_SSO_SECRET
          volumeMounts:
            - name: cookie
              mountPath: /secret
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --provider=oidc
            - --oidc-issuer-url=https://dex.kidd.network
            - --provider-ca-file=/etc/ssl/local-ca/ca.crt
            - --client-id=homepage
            - --redirect-url=https://userpage.kidd.network/oauth2/callback
            - --code-challenge-method=S256
            - --cookie-secret-file=/secret/cookie
            # The users tier's sign-in cookie, shared by every oauth2-proxy of
            # that tier (both clusters): same name, domain and key (derived
            # from AINUR_SSO_SECRET, ":kidd-users-cookie"), so one sign-in
            # covers all of them. One per tier, not one for all: oauth2-proxy
            # deletes a session that fails its group check, so a shared one
            # would sign a friend out of everything at the first admin link.
            - --cookie-name=_kidd_users
            # Dex shows no consent page (skipApprovalScreen) unless asked to,
            # and oauth2-proxy asks by default (approval_prompt=force).
            - --approval-prompt=auto
            - --cookie-domain=.kidd.network
            - --cookie-secure=true
            - --email-domain=*
            - --scope=openid email profile groups
            - --allowed-group=users
            - --allowed-group=admins
            - --skip-provider-button=true
            # The sign-out bookmark's way back to kidd.network.
            - --whitelist-domain=kidd.network
            - --whitelist-domain=.kidd.network
            - --upstream=http://homepage-users.ainur-homepage.svc:3000
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ainur-secrets
                  key: AINUR_OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: cookie
              mountPath: /secret
              readOnly: true
            - name: local-ca
              mountPath: /etc/ssl/local-ca
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: cookie
          emptyDir:
            medium: Memory
        - name: local-ca
          configMap:
            name: lab-ca
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-users
  namespace: ainur-homepage
spec:
  selector:
    app: oauth2-proxy-users
  ports:
    - name: http
      port: 80
      targetPort: http
