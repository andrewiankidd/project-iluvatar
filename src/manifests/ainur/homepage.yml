apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ainur
  # Three Homepage instances from one chart, one per tier:
  #   homepage-public  kidd.network, homepage.kidd.network: no login
  #   homepage-users   userpage.kidd.network: any Dex user (LLDAP's users)
  #   homepage         admin.kidd.network: LLDAP's admins, everything
  # Services list themselves with gethomepage.dev/* annotations on their
  # Ingress: none for every page, `instance: admin` for the admin page only,
  # plus `instance.users: "true"` for the users' page too.
  sources:
    - repoURL: https://jameswynn.github.io/helm-charts
      targetRevision: 2.1.0
      chart: homepage
      helm:
        releaseName: homepage
        valueFiles:
          - $values/src/manifests/ainur/homepage/values.yaml
          - $values/src/manifests/ainur/homepage/values-admin.yaml
    - repoURL: https://jameswynn.github.io/helm-charts
      targetRevision: 2.1.0
      chart: homepage
      helm:
        releaseName: homepage-users
        valueFiles:
          - $values/src/manifests/ainur/homepage/values.yaml
          - $values/src/manifests/ainur/homepage/values-users.yaml
    - repoURL: https://jameswynn.github.io/helm-charts
      targetRevision: 2.1.0
      chart: homepage
      helm:
        releaseName: homepage-public
        valueFiles:
          - $values/src/manifests/ainur/homepage/values.yaml
          - $values/src/manifests/ainur/homepage/values-public.yaml
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision:  main
      path: src/manifests/ainur/homepage
      directory:
        exclude: 'values*.yaml'
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision:  main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-homepage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        ainur.kidd.network/ca: inject
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
