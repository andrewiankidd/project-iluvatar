apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: ainur
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ainur
  # Two Homepage instances from one chart: homepage at userpage.kidd.network
  # (everything, behind a Dex login) and homepage-public at kidd.network and
  # homepage.kidd.network (only what is marked public, no login). Services
  # list themselves with gethomepage.dev/* annotations on their Ingress.
  sources:
    - repoURL: https://jameswynn.github.io/helm-charts
      targetRevision: 2.1.0
      chart: homepage
      helm:
        releaseName: homepage
        valueFiles:
          - $values/src/manifests/ainur/homepage/values.yaml
          - $values/src/manifests/ainur/homepage/values-private.yaml
    - repoURL: https://jameswynn.github.io/helm-charts
      targetRevision: 2.1.0
      chart: homepage
      helm:
        releaseName: homepage-public
        valueFiles:
          - $values/src/manifests/ainur/homepage/values.yaml
          - $values/src/manifests/ainur/homepage/values-public.yaml
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision:  main
      path: src/manifests/ainur/homepage
      directory:
        exclude: 'values*.yaml'
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision:  main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ainur-homepage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        ainur.kidd.network/ca: inject
    automated:
      prune: true
      selfHeal: true
