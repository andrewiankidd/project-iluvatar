; CouchDB settings for Obsidian's Self-hosted LiveSync plugin, as its own
; setup guide gives them: one node, logins required everywhere, documents and
; requests big enough for attachments, and CORS for the Obsidian apps
; (app:// on desktop, capacitor:// and http://localhost on phones).
[couchdb]
single_node = true
max_document_size = 50000000

; One copy of each shard: there is one node.
[cluster]
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
bind_address = 0.0.0.0

; Metrics for Prometheus on a port of their own, without the login every
; other path needs; that port isn't on the Service the tunnel reaches.
[prometheus]
additional_port = true
bind_address = 0.0.0.0
port = 17986

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET,PUT,POST,HEAD,DELETE
max_age = 3600
