# CSI volume snapshots on arda: the VolumeSnapshot CRDs and their controller,
# which Longhorn's CSI driver needs before anything can snapshot a volume.
# VolSync backs each volume up from a snapshot (volsync.yml), so a live world
# is never copied mid-write. The class is longhorn/snapshot-class.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
  annotations:
    # Before anything with a volume: see kyverno-policies.yml.
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arda
  source:
    repoURL: https://piraeus.io/helm-charts
    chart: snapshot-controller
    targetRevision: 5.4.0
  destination:
    name: arda
    namespace: snapshot-controller
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
