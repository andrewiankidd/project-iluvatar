# What an Ingress names to sit behind the Dex login, by tier:
#   admins only (deployment.yaml):
#     traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-dex@kubernetescrd
#   users and admins (users.yaml), for what friends and family get:
#     traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-dex-users@kubernetescrd
#
# Traefik asks oauth2-proxy about each request: logged in, it goes through
# (with the user's name and email as X-Auth-Request-* headers); not, the
# browser is sent to the login.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dex
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dex-users
spec:
  forwardAuth:
    address: http://oauth2-proxy-users.oauth2-proxy.svc/
    trustForwardHeader: true
    # Also the name and groups (this proxy asks Dex for groups), for apps
    # that make accounts from them (media/grimmory.yaml). Each replaces any
    # header of the same name the browser sent.
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
