# oauth2-proxy in forward-auth mode: no upstream of its own (static 202 for
# a logged-in request), only answering Traefik's Middleware (middleware.yaml)
# and serving the login's own pages at auth.kidd.network.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      # The cookie key, derived from the client secret: no new value in .env,
      # and the same on every rebuild, so logins outlive a restart.
      initContainers:
        - name: cookie-secret
          image: alpine:3.22
          command:
            - sh
            - -c
            - printf '%s' "$CLIENT_SECRET:arda-oauth2-proxy-cookie" | sha256sum | cut -c1-32 | tr -d '\n' > /secret/cookie
          env:
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex
                  key: client-secret
          volumeMounts:
            - name: cookie
              mountPath: /secret
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --provider=oidc
            - --oidc-issuer-url=https://dex.kidd.network
            - --provider-ca-file=/etc/dex/ca.crt
            - --client-id=arda
            - --redirect-url=https://auth.kidd.network/oauth2/callback
            - --code-challenge-method=S256
            - --cookie-secret-file=/secret/cookie
            # Its own name: ainur's Headlamp proxy has the default one, on
            # headlamp.kidd.network, which this domain-wide cookie also reaches.
            - --cookie-name=_kidd_auth
            - --cookie-domain=.kidd.network
            - --cookie-secure=true
            - --whitelist-domain=.kidd.network
            - --email-domain=*
            - --skip-provider-button=true
            - --set-xauthrequest=true
            - --upstream=static://202
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex
                  key: client-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: cookie
              mountPath: /secret
              readOnly: true
            - name: dex
              mountPath: /etc/dex
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: cookie
          emptyDir:
            medium: Memory
        - name: dex
          secret:
            secretName: dex
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The login's own pages and Dex's callback, on the internet and the LAN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  annotations:
    kidd.network/tunnel: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: auth.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  name: http
