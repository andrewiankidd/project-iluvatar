# The homeassistant app (../homeassistant.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
resources:
  - deployment.yaml
configMapGenerator:
  # configuration.yaml, from Git; the hash suffix restarts Home Assistant on
  # a change, which is how it picks YAML up anyway.
  - name: homeassistant-config
    files:
      - configuration.yaml
