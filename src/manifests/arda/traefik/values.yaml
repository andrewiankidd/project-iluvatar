# Traefik chart 42.3.2 on arda (../traefik.yml).

# The traefik IngressClass, as the default.
ingressClass:
  enabled: true
  isDefaultClass: true

# Ingresses report the Service's address, which external-dns needs before it
# makes any record (external-dns-tunnel then points it at the tunnel anyway).
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
    # For an Ingress that sends a host on to ainur by name
    # (../cloudflared/ainur-homepage.yaml).
    allowExternalNameServices: true
  # So any Ingress can use the Dex login, the Middleware in the oauth2-proxy
  # namespace (../oauth2-proxy/middleware.yaml).
  kubernetesCRD:
    allowCrossNamespace: true

# The tunnel arrives on plain HTTP from cloudflared's pods; believe what
# they say the visitor used (X-Forwarded-Proto: https), so a login sends the
# browser back to an https:// address. Only pod addresses are trusted, not
# the LAN.
ports:
  web:
    forwardedHeaders:
      trustedIPs:
        - 10.244.0.0/16

# On arda's shared 192.168.1.58 (../metallb), so the sites also answer on the
# LAN (the chart's Service is a LoadBalancer already). Not port-forwarded:
# from outside, the web comes in through the tunnel.
service:
  annotations:
    metallb.io/allow-shared-ip: arda

# HTTPS on the LAN: a *.kidd.network certificate from the lab CA, made by
# ainur's cert-manager and copied here as kube-system/arda-lan-tls by ainur's
# arda-bootstrap Job (src/manifests/ainur/sidero-omni/arda-lan-certificate.yaml).
# Devices that trust the lab CA trust arda's sites at home, as they do
# ainur's. Until it arrives, Traefik's own self-signed one. The tunnel is
# plain HTTP to Traefik, and Cloudflare's certificate on the internet.
tlsStore:
  default:
    defaultCertificate:
      secretName: arda-lan-tls

# CrowdSec bouncer plugin (../crowdsec.yml): checks internet visitors on the
# `web` entrypoint (where cloudflared delivers tunnel traffic) against
# CrowdSec's LAPI stream cache using CF-Connecting-IP. LAN HTTPS traffic
# arrives on `websecure` and is untouched.
experimental:
  plugins:
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.2

additionalArguments:
  - "--entrypoints.web.http.middlewares=crowdsec-crowdsec-bouncer@kubernetescrd"

deployment:
  additionalVolumes:
    - name: crowdsec-bouncer-key
      secret:
        secretName: crowdsec-bouncer-key

additionalVolumeMounts:
  - name: crowdsec-bouncer-key
    mountPath: /etc/traefik/crowdsec
    readOnly: true

# An access log (JSON, to stdout, so into Loki with arda's other pod logs),
# for unique visitors and CrowdSec: metrics can't count visitors, as that needs
# each visitor's address. Cloudflare's CF-Connecting-IP, CF-IPCountry and
# User-Agent (for CrowdSec's bad-user-agent / probing scenarios) are the only
# headers kept; LAN requests have neither CF-* header. Grafana: Edge, visitors.
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        CF-Connecting-IP: keep
        CF-IPCountry: keep
        User-Agent: keep

# Its metrics, for ainur's Prometheus (through arda's agent): requests, errors
# and latency per site (router) and backend (service).
metrics:
  prometheus:
    addRoutersLabels: true
    # Requests by visitor country, for the traffic map (Grafana: Edge, Rack):
    # Cloudflare adds CF-IPCountry (ISO code) to everything through the tunnel,
    # and cloudflared passes it on. LAN requests have none (an empty label).
    headerLabels:
      country: CF-IPCountry
    service:
      enabled: true
    serviceMonitor:
      enabled: true
