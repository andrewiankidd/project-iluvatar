# Jellyfin: plays the library, at jellyfin.kidd.network, LAN only. Its own
# users, made in its first-run wizard (the admin first); Seerr signs in with
# them.
#
# Libraries, added in that wizard: /data/media/tv (Shows) and
# /data/media/movies (Movies). It reads the same volume as everything else
# (storage.yaml).
#
# Transcoding is on the CPU for now. arda's Intel GPU has no driver loaded:
# Talos needs the siderolabs/i915 extension in arda's schematic, and the pod
# then needs /dev/dri (BACKLOG.md, "Media").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi   # metadata and artwork grow with the library
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
    kidd.network/media-volume: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate   # one writer per volume
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyfin
          image: ghcr.io/jellyfin/jellyfin:10.11.11
          env:
            - { name: TZ, value: Europe/London }
            - { name: JELLYFIN_PublishedServerUrl, value: https://jellyfin.kidd.network }
          ports:
            - name: http
              containerPort: 8096
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 2Gi }   # a CPU transcode's buffers
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        # Transcodes and image cache: nothing worth keeping.
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: data
          persistentVolumeClaim:
            claimName: media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  annotations:
    # LAN only. Its own login.
    # On the private Homepage (copied to ainur's by its arda-homepage CronJob).
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: private
    gethomepage.dev/group: Media
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/description: Watch
    gethomepage.dev/icon: jellyfin.png
    gethomepage.dev/href: https://jellyfin.kidd.network
    # Its pods are on arda, where ainur's Homepage can't look: no status badge.
    gethomepage.dev/external: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: jellyfin.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
