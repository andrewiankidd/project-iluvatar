# Radarr: films, at radarr.kidd.network behind the Dex login.
#
# Its own login is "External": the Dex login in front is the only one. Its
# API key is fixed (the media Secret) so the other apps and wiring.yaml can
# use it; it is set through the environment, which overrides config.xml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate   # one writer per volume
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: TZ, value: Europe/London }
            - { name: RADARR__AUTH__METHOD, value: External }
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: media
                  key: radarr-api-key
          ports:
            - name: http
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  annotations:
    # LAN only, behind the Dex login.
    traefik.ingress.kubernetes.io/router.middlewares: oauth2-proxy-dex@kubernetescrd
    # On the private Homepage (copied to ainur's by its arda-homepage CronJob).
    gethomepage.dev/enabled: "true"
    gethomepage.dev/instance: private
    gethomepage.dev/group: Media
    gethomepage.dev/name: Radarr
    gethomepage.dev/description: Films
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/href: https://radarr.kidd.network
    # Its pods are on arda, where ainur's Homepage can't look: no status badge.
    gethomepage.dev/external: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  name: http
