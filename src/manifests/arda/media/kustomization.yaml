# The media app (../media.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - storage.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - bazarr.yaml
  - qbittorrent.yaml
  - seerr.yaml
  - jellyfin.yaml
  - plex.yaml
  - wiring.yaml
configMapGenerator:
  - name: wiring
    files:
      - wiring.mjs
patches:
  # Every pod that mounts the media volume (storage.yaml) on one node: it is
  # ReadWriteOnce, attached to one node at a time. A Deployment opts in with
  # the label kidd.network/media-volume: "true"; the first such pod goes
  # wherever the scheduler likes, and the rest follow it.
  - target:
      kind: Deployment
      labelSelector: kidd.network/media-volume=true
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/kidd.network~1media-volume
        value: "true"
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    kidd.network/media-volume: "true"
