# Publishes arda's Service hostnames to the kidd.network zone on Cloudflare,
# DNS only: what cannot go through the tunnel, such as Minecraft. A Service
# says where its record points (external-dns.kubernetes.io/target), or gets
# its LoadBalancer address. Ingress hosts are external-dns-tunnel.yml's.
#
# Reads the cloudflare-api-token Secret: ARDA_CLOUDFLARE_API_TOKEN in the
# bootstrap VM's .env (Zone:DNS:Edit on kidd.network), handed out by
# src/manifests/ainur/sidero-omni/arda-bootstrap-job.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: 1.23.0
      helm:
        valueFiles:
          - $values/src/manifests/arda/external-dns/values.yaml
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
