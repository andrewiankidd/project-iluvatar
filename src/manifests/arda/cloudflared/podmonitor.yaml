# cloudflared's metrics (config.yaml: metrics on :2000): requests through the
# tunnel, errors, and its connections to Cloudflare's edge.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
