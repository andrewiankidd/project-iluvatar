# external-dns chart 1.23.0, Cloudflare provider.

provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

sources:
  - service
  - ingress

# The Cloudflare zone. It has to be the zone itself: a subdomain here
# filters the zone out and nothing is published. What gets published is
# arda's Ingress hosts and Services with an external-dns.kubernetes.io/hostname
# annotation; records anyone else made in the zone are never touched (below).
domainFilters:
  - kidd.network

# Deletes the records it created when their Service or Ingress goes away,
# and never touches records it did not create (owned through TXT records).
policy: sync
registry: txt
txtOwnerId: arda

triggerLoopOnEvent: true

extraArgs:
  # The portal's *.minecraft.kidd.network needs a TXT owner record too, and
  # "*" is not valid in its name.
  - --txt-wildcard-replacement=wildcard
