# Longhorn chart 1.13.0 on arda (../longhorn.yml).

defaultSettings:
  defaultDataPath: /var/mnt/longhorn
  # Only on nodes labelled node.longhorn.io/create-default-disk=true, which
  # ainur's arda-disks CronJob does once the SSD's volume is mounted there.
  # Otherwise a new node's replicas land in the bare directory on the NVMe
  # and are hidden, and fail, when Talos mounts the SSD over it.
  createDefaultDiskLabeledNodes: true
  defaultReplicaCount: "3"
  replicaAutoBalance: best-effort
  # Let a node drain even when it holds a volume's last replica. With one
  # node every replica is the last, so the default (block-if-contains-last-
  # replica) keeps a PodDisruptionBudget on the instance manager that no
  # drain can satisfy: a Talos upgrade through Omni cordons the node, evicts
  # every workload, then waits forever, with all of arda down (2026-11-19,
  # adding i915). By the time the instance manager goes, the workloads are
  # gone and their volumes detached. Worth revisiting with three nodes.
  nodeDrainPolicy: always-allow

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3

preUpgradeChecker:
  jobEnabled: false

# Longhorn's metrics, for ainur's Prometheus (via arda's agent, ../monitoring):
# a faulted volume alerts.
metrics:
  serviceMonitor:
    enabled: true
