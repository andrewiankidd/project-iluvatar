# What volsync.yaml needs Kyverno to be allowed to do, added to its own
# ClusterRoles by their aggregation labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:volsync:background
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [volsync.backube]
    resources: [replicationsources, replicationdestinations]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:volsync:admission
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
# Kyverno refuses a generate policy unless its admission controller can read
# every kind the policy makes, so not just the one volsync-r2 Secret.
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [volsync.backube]
    resources: [replicationsources, replicationdestinations]
    verbs: [get, list, watch]
