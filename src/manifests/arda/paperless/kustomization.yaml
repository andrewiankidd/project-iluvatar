# The paperless app (../paperless.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless
resources:
  - deployment.yaml
  - smb.yaml
  - setup.yaml
configMapGenerator:
  - name: paperless-setup
    files:
      - setup.py
  # Python's strict certificate checks, relaxed for the lab CA (see the file);
  # the hash suffix restarts Paperless on a change.
  - name: paperless-sitecustomize
    files:
      - sitecustomize.py
