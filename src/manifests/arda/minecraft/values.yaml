# itzg/minecraft-server-charts "minecraft" chart, 5.3.1.
#
# Same server as docker-compose.yml in this folder; change both together.
# Migration: sync with replicaCount 0, untar the /data backup into the PVC
# from a throwaway pod, chown -R 1000:1000, then scale to 1.

image:
  repository: itzg/minecraft-server
  tag: 2026.11.0-java25

resources:
  requests:
    memory: 7Gi
    cpu: 1000m
  limits:
    memory: 8Gi

strategy:
  type: Recreate   # one writer per world

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: "26.3"
  memory: 6G
  motd: mcc.kidd.network
  difficulty: easy
  viewDistance: 16
  serviceType: LoadBalancer
  servicePort: 25565
  modrinth:
    projects:
      - worldedit:YFnqiUlL
      - worldguard:fiHLM6oY
      - luckperms:b0mk8uS6
      - craftbook:6kl3GQSJ
      - squaremap:6wmZVQBO
  pluginUrls:
    - https://ci.citizensnpcs.co/job/Citizens2/4269/artifact/dist/target/Citizens-2.0.44-b4269.jar
    - https://ci.citizensnpcs.co/job/Denizen_Developmental/7314/artifact/target/Denizen-1.3.4-b7314-DEV.jar
  rcon:
    enabled: true
  extraPorts:
    - name: map
      containerPort: 8080
      protocol: TCP
      service:
        enabled: true
        embedded: false
        type: ClusterIP
        port: 8080
      ingress:
        enabled: false   # TODO: traefik + local-ca like the ainur apps

extraEnv:
  TZ: Europe/London
  PAPER_BUILD: "249"
  USE_AIKAR_FLAGS: "true"
  MODE: creative
  FORCE_GAMEMODE: "true"
  SIMULATION_DISTANCE: "10"
  SPAWN_PROTECTION: "0"
  ENABLE_WHITELIST: "true"
  ENFORCE_WHITELIST: "true"

persistence:
  dataDir:
    enabled: true
    Size: 20Gi
    # storageClass: longhorn   # decide once arda's storage exists
