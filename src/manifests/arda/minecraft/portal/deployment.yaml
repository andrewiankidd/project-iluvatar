apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: minecraft-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-portal
  template:
    metadata:
      labels:
        app: minecraft-portal
    spec:
      serviceAccountName: portal
      containers:
        - name: web
          image: nginx:1.31.8-alpine
          env:
            - name: NAMESPACE   # for the map Services' names
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The image sets NGINX_LOCAL_RESOLVERS from resolv.conf.
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            # Rendered to /etc/nginx/conf.d/default.conf, replacing the default.
            - name: web
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: nginx.conf.template
            - name: data
              mountPath: /usr/share/nginx/html/data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: refresher
          image: python:3.14-alpine
          command: ["python", "-I", "-u", "/app/refresh.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OUT
              value: /data/servers.json
          volumeMounts:
            - name: refresher
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
        # Spawn views for the server list, from each server's BlueMap in
        # headless Chromium (software WebGL), once an hour.
        - name: snapshot
          image: mcr.microsoft.com/playwright/python:v1.65.1-noble
          command:
            - sh
            - -c
            - >-
              pip install --quiet --break-system-packages playwright==1.65.1 &&
              exec python -I -u /app/snapshot.py
          env:
            - name: DATA
              value: /data
          volumeMounts:
            - name: snapshot
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1536Mi }
      volumes:
        - name: web
          configMap:
            name: portal-web
        - name: refresher
          configMap:
            name: portal-refresher
        - name: snapshot
          configMap:
            name: portal-snapshot
        - name: data
          emptyDir:
            sizeLimit: 64Mi
