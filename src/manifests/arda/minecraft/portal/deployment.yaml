apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: minecraft-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-portal
  template:
    metadata:
      labels:
        app: minecraft-portal
    spec:
      serviceAccountName: portal
      containers:
        - name: web
          image: nginx:1.31.8-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: data
              mountPath: /usr/share/nginx/html/data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
        - name: refresher
          image: python:3.14-alpine
          command: ["python", "-I", "-u", "/app/refresh.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OUT
              value: /data/servers.json
          volumeMounts:
            - name: refresher
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: web
          configMap:
            name: portal-web
        - name: refresher
          configMap:
            name: portal-refresher
        - name: data
          emptyDir:
            sizeLimit: 1Mi
