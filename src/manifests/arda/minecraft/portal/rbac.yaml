# The refresher reads Services in its own namespace, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-read-services
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-read-services
subjects:
  - kind: ServiceAccount
    name: portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal-read-services
