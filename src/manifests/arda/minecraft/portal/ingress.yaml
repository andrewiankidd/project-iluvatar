# minecraft.kidd.network, through the Cloudflare Tunnel: HTTPS is Cloudflare's
# (../../cloudflared.yml), and external-dns-tunnel publishes the host.
#
# Only this one name: Cloudflare's free certificate stops one level below
# kidd.network, so nothing under minecraft.kidd.network could have HTTPS.
# The servers' maps are paths here instead (/map/<name>/, nginx.conf.template).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
spec:
  ingressClassName: traefik
  rules:
    - host: minecraft.kidd.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
