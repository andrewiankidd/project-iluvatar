# Shared values for every server under ../servers/<name>/, applied first.
# itzg/minecraft-server-charts "minecraft" chart, 5.3.1.
#
# Per-server values.yaml is layered on top. Anything that depends on the
# server's name (hostnames, map ingress, Bedrock port, portal metadata) is
# generated by the ApplicationSet in ../../minecraft.yml, not written here.
#
# Helm merges maps but replaces lists: a server that sets its own
# modrinth.projects or pluginUrls replaces these, it does not add to them.

image:
  repository: itzg/minecraft-server
  tag: 2026.11.0-java25

resources:
  requests:
    memory: 7Gi
    cpu: 1000m
  limits:
    memory: 8Gi

strategy:
  type: Recreate   # one writer per world

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: "26.3"
  memory: 6G
  viewDistance: 16
  serviceType: LoadBalancer
  servicePort: 25565
  modrinth:
    projects:
      - worldedit:YFnqiUlL
      - worldguard:fiHLM6oY
      - luckperms:b0mk8uS6
      - craftbook:6kl3GQSJ
      - bluemap:uHQIrUdf      # 3D web map on :8100
  pluginUrls:
    - https://ci.citizensnpcs.co/job/Citizens2/4269/artifact/dist/target/Citizens-2.0.44-b4269.jar
    - https://ci.citizensnpcs.co/job/Denizen_Developmental/7314/artifact/target/Denizen-1.3.4-b7314-DEV.jar
    # Bedrock clients join the Java server through Geyser on UDP 19132;
    # Floodgate lets them in without a Java account.
    - https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1302/downloads/spigot
    - https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
  rcon:
    enabled: true

extraVolumes:
  - volumeMounts:
      - name: patches
        mountPath: /patches
        readOnly: true
    volumes:
      - name: patches
        configMap:
          name: minecraft-patches   # from ../kustomization.yaml
  - volumes:                        # mounted by the info sidecar only
      - name: info
        configMap:
          name: minecraft-info      # from ../kustomization.yaml

# BlueMap renders only after accept-download is set: it then fetches the
# Minecraft client's textures from Mojang, under the EULA accepted above.
# Its core.conf is generated on first start, so this sets the one line in
# it, or seeds the file with that line before the first start.
initContainers:
  - name: bluemap-accept-download
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        f=/data/plugins/BlueMap/core.conf
        mkdir -p "${f%/*}"
        if [ -f "$f" ]; then
          sed -i 's/^accept-download: false/accept-download: true/' "$f"
        else
          echo 'accept-download: true' > "$f"
        fi
    volumeMounts:
      - name: datadir
        mountPath: /data

# Versions and spawn for the portal, at :8099/info.json (the "info" port the
# ApplicationSet adds). Asks the server over RCON on localhost, so the
# password stays in the pod, and reads spawn from the world's level.dat.
sidecarContainers:
  - name: info
    image: python:3.14-alpine
    command: ["python", "-I", "-u", "/app/info.py"]
    env:
      - name: RCON_PASSWORD
        valueFrom:
          secretKeyRef:
            name: '{{ template "minecraft.fullname" . }}-rcon'
            key: rcon-password
    volumeMounts:
      - name: info
        mountPath: /app
        readOnly: true
      - name: datadir       # the chart's world volume, for level.dat
        mountPath: /data
        readOnly: true
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }

extraEnv:
  PATCH_DEFINITIONS: /patches
  TZ: Europe/London
  PAPER_BUILD: "249"
  USE_AIKAR_FLAGS: "true"
  SIMULATION_DISTANCE: "10"
  SPAWN_PROTECTION: "0"   # WorldGuard owns protection
  ENABLE_WHITELIST: "true"
  ENFORCE_WHITELIST: "true"

persistence:
  annotations:
    # The world outlives the app: Argo never prunes or deletes this claim.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  dataDir:
    enabled: true
    Size: 20Gi
    # storageClass: longhorn   # decide once arda's storage exists
