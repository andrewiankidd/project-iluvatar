# Shared values for every server under ../servers/<name>/, applied first.
# itzg/minecraft-server-charts "minecraft" chart, 5.3.1.
#
# Per-server values.yaml is layered on top. Anything that depends on the
# server's name (hostnames, map ingress, Bedrock port, portal metadata) is
# generated by the ApplicationSet in ../../minecraft.yml, not written here.
#
# Helm merges maps but replaces lists: a server that sets its own
# modrinth.projects or pluginUrls replaces these, it does not add to them.

image:
  repository: itzg/minecraft-server
  tag: 2026.11.0-java25

resources:
  requests:
    memory: 7Gi
    cpu: 1000m
  limits:
    memory: 8Gi

strategy:
  type: Recreate   # one writer per world

minecraftServer:
  eula: "TRUE"
  type: PAPER
  version: "26.3"
  memory: 6G
  viewDistance: 16
  serviceType: LoadBalancer
  servicePort: 25565
  modrinth:
    projects:
      - worldedit:YFnqiUlL
      - worldguard:fiHLM6oY
      - luckperms:b0mk8uS6
      - bluemap:uHQIrUdf      # 3D web map on :8100
      - pocketmap:gMipoSQM    # minimap: a vanilla map in the offhand, Java and Bedrock
      - forcepack:FMfWT1Xk    # sends Java players the packs in common/files/forcepack.yml
  pluginUrls:
    - https://ci.citizensnpcs.co/job/Citizens2/4269/artifact/dist/target/Citizens-2.0.44-b4269.jar
    - https://ci.citizensnpcs.co/job/Denizen_Developmental/7314/artifact/target/Denizen-1.3.4-b7314-DEV.jar
    # Bedrock clients join the Java server through Geyser on UDP 19132;
    # Floodgate lets them in without a Java account.
    - https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1302/downloads/spigot
    - https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/spigot
  rcon:
    enabled: true

extraVolumes:
  - volumeMounts:
      - name: patches
        mountPath: /patches
        readOnly: true
    volumes:
      - name: patches
        configMap:
          name: minecraft-patches   # from ../kustomization.yaml
  - volumes:                        # mounted by the info sidecar only
      - name: info
        configMap:
          name: minecraft-info      # from ../kustomization.yaml
  - volumes:                        # mounted by the managed-files init container only
      - name: files
        configMap:
          name: minecraft-files     # from ../kustomization.yaml
          items:                    # key -> where it goes under /data/plugins
            - key: forcepack.yml
              path: ForcePack/config.yml
            - key: pocketmap-default.dsc
              path: Denizen/scripts/pocketmap-default.dsc
  - volumes:                        # mounted by the bedrock-packs init container only
      - name: bedrock-packs
        configMap:
          name: minecraft-files
          items:
            - key: bedrock-packs.txt
              path: bedrock-packs.txt

# BlueMap renders only after accept-download is set: it then fetches the
# Minecraft client's textures from Mojang, under the EULA accepted above.
# Its core.conf is generated on first start, so this sets the one line in
# it, or seeds the file with that line before the first start.
initContainers:
  - name: bluemap-accept-download
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        f=/data/plugins/BlueMap/core.conf
        mkdir -p "${f%/*}"
        if [ -f "$f" ]; then
          sed -i 's/^accept-download: false/accept-download: true/' "$f"
        else
          echo 'accept-download: true' > "$f"
        fi
    volumeMounts:
      - name: datadir
        mountPath: /data
  # Plugin files owned by this repo (common/files/), laid over /data/plugins
  # on every start: what is here wins over in-game edits.
  - name: managed-files
    image: alpine:3.22
    # The glob skips the volume's own ..data entries.
    command: ["sh", "-c", "for d in /files/*; do cp -RLv \"$d\" /data/plugins/; done"]
    volumeMounts:
      - name: files
        mountPath: /files
        readOnly: true
      - name: datadir
        mountPath: /data
  # The Bedrock resource packs in common/files/bedrock-packs.txt, into Geyser's
  # packs folder. A pack that cannot be fetched is skipped with a warning
  # rather than holding the server down.
  - name: bedrock-packs
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        dir=/data/plugins/Geyser-Spigot/packs
        mkdir -p "$dir"
        keep=" "
        grep -Ev '^[[:space:]]*(#|$)' /packs/bedrock-packs.txt > /tmp/list
        while read -r sha url; do
          f="$dir/$sha.mcpack"
          keep="$keep$f "
          if [ -f "$f" ] && echo "$sha  $f" | sha256sum -cs; then
            echo "have $url"
          elif wget -qO "$f.part" "$url" && echo "$sha  $f.part" | sha256sum -cs; then
            mv "$f.part" "$f" && echo "got $url"
          else
            rm -f "$f.part" && echo "WARNING: could not fetch $url, or its sha256 differs"
          fi
        done < /tmp/list
        for f in "$dir"/*.mcpack; do
          case "$keep" in *" $f "*) ;; *) [ -f "$f" ] && rm -f "$f" && echo "removed $f" ;; esac
        done
    volumeMounts:
      - name: bedrock-packs
        mountPath: /packs
        readOnly: true
      - name: datadir
        mountPath: /data

# Versions and spawn for the portal, at :8099/info.json (the "info" port the
# ApplicationSet adds). Asks the server over RCON on localhost, so the
# password stays in the pod, and reads spawn from the world's level.dat.
sidecarContainers:
  - name: info
    image: python:3.14-alpine
    command: ["python", "-I", "-u", "/app/info.py"]
    env:
      - name: RCON_PASSWORD
        valueFrom:
          secretKeyRef:
            name: '{{ template "minecraft.fullname" . }}-rcon'
            key: rcon-password
    volumeMounts:
      - name: info
        mountPath: /app
        readOnly: true
      - name: datadir       # the chart's world volume, for level.dat
        mountPath: /data
        readOnly: true
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits: { memory: 64Mi }

extraEnv:
  PATCH_DEFINITIONS: /patches
  TZ: Europe/London
  PAPER_BUILD: "249"
  USE_AIKAR_FLAGS: "true"
  SIMULATION_DISTANCE: "10"
  SPAWN_PROTECTION: "0"   # WorldGuard owns protection
  ENABLE_WHITELIST: "true"
  ENFORCE_WHITELIST: "true"

persistence:
  annotations:
    # The world outlives the app: Argo never prunes or deletes this claim.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  dataDir:
    enabled: true
    Size: 20Gi
    # storageClass: longhorn   # decide once arda's storage exists
