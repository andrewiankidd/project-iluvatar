# arda's pod logs and events, to ainur's Loki (monitoring/logs-values.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arda
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: k8s-monitoring
      targetRevision: 4.6.1
      helm:
        releaseName: logs
        valueFiles:
          - $values/src/manifests/arda/monitoring/logs-values.yaml
    - repoURL: https://github.com/andrewiankidd/project-iluvatar.git
      targetRevision: main
      ref: values
  destination:
    name: arda
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs are too big for client-side apply.
      - ServerSideApply=true
    # node-exporter and the log collectors read the host; Talos enforces
    # baseline otherwise.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    # Keep retrying a failed sync: a fresh cluster has to come up on
    # its own, and most failures are ordering (a CRD, webhook or
    # Secret not there yet) that resolves itself.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
